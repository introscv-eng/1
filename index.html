function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const startOfWeekMon = (d) => { const r = new Date(d); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(r, diff); };

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function getHolidayName(dateStr, customHolidays) {
  if (customHolidays && customHolidays[dateStr]) return customHolidays[dateStr];
  if (FIXED_HOLIDAYS[dateStr]) return FIXED_HOLIDAYS[dateStr];
  const mmdd = dateStr.slice(5);
  if (FIXED_HOLIDAYS[mmdd]) return FIXED_HOLIDAYS[mmdd];
  return null;
}

function sortEvents(events) {
  const catOrder = EVENT_CATEGORIES;
  return [...events].sort((a, b) => {
    const catA = a.dept || "학습";
    const catB = b.dept || "학습";
    const idxA = catOrder.indexOf(catA);
    const idxB = catOrder.indexOf(catB);
    if (idxA !== idxB) return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
    return (a.content || "").localeCompare(b.content || "", "ko");
  });
}

function DateRow({ date, today, events, isLast, onAddEvent, onOpenEvent, customHolidays, selectedEventIds, onToggleSelectEvent, onToggleSelectDate, isDateSelected }) {
  const dateStr = ymd(date);
  const dow = date.getDay();
  const isToday = sameDay(date, today);
  const holidayName = getHolidayName(dateStr, customHolidays);
  const isHoliday = dow === 0 || !!holidayName;

  const rowBg = isToday ? "bg-emerald-50/70" : isHoliday ? "bg-rose-50/40" : dow === 6 ? "bg-blue-50/30" : "bg-white";
  const dateColor = isToday ? "text-emerald-600" : isHoliday ? "text-rose-500 font-black" : dow === 6 ? "text-blue-400" : "text-slate-500";

  const sortedEvents = sortEvents(events);

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 min-h-[52px] ${rowBg} ${isLast ? "border-b-0" : ""}`}>
      <div className={`flex w-16 shrink-0 flex-col items-start pt-0.5 sm:w-20 ${dateColor}`}>
        <div className="flex items-center gap-1.5 mb-1">
          <input
            type="checkbox"
            checked={isDateSelected}
            onChange={() => onToggleSelectDate(dateStr, events)}
            className="h-3.5 w-3.5 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
            title="이 날짜 전체 선택"
          />
        </div>
        <div className="flex items-center gap-1 text-sm font-extrabold">
          {date.getDate()}
          <span className="text-xs font-bold">({WEEKDAY_KOR[dow]})</span>
        </div>
        {holidayName && (
          <span className="mt-0.5 inline-block text-[10px] font-bold leading-tight text-rose-500 break-keep">
            {holidayName}
          </span>
        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {sortedEvents.length === 0 ? (
          <p className="pt-0.5 text-xs text-slate-300">-</p>
        ) : (
          sortedEvents.map((ev) => {
            const isChecked = selectedEventIds.has(ev.id);
            const badgeLabel = ev.dept || "학습";
            const isGradeCommon = badgeLabel === "학년 공통";
            const hasCustomTarget = isGradeCommon && ev.manager && ev.manager !== "전체";

            return (
              <div key={ev.id} className="flex items-center gap-2 group">
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggleSelectEvent(ev.id)}
                  className="h-4 w-4 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
                  title="개별 일정 선택"
                />
                <button onClick={() => onOpenEvent(ev)} className="flex flex-1 items-center gap-2 rounded-lg px-1 py-0.5 text-left hover:bg-slate-100/85 transition min-w-0">
                  <Badge className={getTagStyle(badgeLabel)}>{badgeLabel}</Badge>
                  {hasCustomTarget && (
                    <span className="rounded-md border border-violet-200 bg-violet-100/80 px-1.5 py-0.5 text-[11px] font-extrabold text-violet-800 shrink-0">
                      {ev.manager}
                    </span>
                  )}
                  <span className="pt-0.5 text-[13px] leading-snug text-slate-700 font-medium truncate">{ev.content}</span>
                  {!isGradeCommon && ev.manager && (
                    <span className="ml-auto shrink-0 pt-0.5 text-[13px] leading-snug text-slate-700 font-medium pl-2">
                      {ev.manager}
                    </span>
                  )}
                </button>
              </div>
            );
          })
        )}
      </div>
      <button onClick={() => onAddEvent(dateStr)} className="flex h-6 w-6 shrink-0 items-center justify-center self-start rounded-full text-slate-300 transition hover:bg-violet-100 hover:text-violet-500" title="이 날짜에 일정 추가">
        <PlusIcon size={16} />
      </button>
    </div>
  );
}

  const parseCsvLine = (text) => {
    const result = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (c === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = "";
      } else {
        cur += c;
      }
    }
    result.push(cur.trim());
    return result;
  };

  const parseGradeStr = (raw) => {
    if (!raw) return selectedGrade;
    const match = String(raw).match(/\d+/);
    if (match) return `${match[0]}학년`;
    return raw.includes("학년") ? raw : `${raw}학년`;
  };

  const parseClassStr = (raw) => {
    if (!raw) return { dept: "학년 공통", manager: "전체", category: "학년 공통" };
    const str = String(raw).trim();
    if (str === "전체" || str === "공통" || str === "학년 공통" || str === "") {
      return { dept: "학년 공통", manager: "전체", category: "학년 공통" };
    }

    if (!/\d/.test(str)) {
      return { dept: str, manager: "", category: "학습" };
    }

    const digits = str.replace(/[^\d]/g, '').split('').filter(Boolean);
    if (digits.length === 1) {
      return { dept: `${digits[0]}반`, manager: "", category: "학습" };
    } else if (digits.length > 1) {
      const uniqueDigits = Array.from(new Set(digits)).sort((a, b) => a - b);
      const classListFormatted = uniqueDigits.map(d => `${d}반`).join(", ");
      return { dept: "학년 공통", manager: classListFormatted, category: "학년 공통" };
    }

    return { dept: str, manager: "", category: "학습" };
  };

  const handleCsvFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setCsvFileName(file.name);
    setCsvError("");

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = event.target.result;
        
        // XML 기반 SpreadsheetML 파싱 처리
        if (text.includes("<?xml") || text.includes("<Workbook")) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, "text/xml");
          const rows = xmlDoc.getElementsByTagName("Row");
          const parsed = [];
          
          for (let i = 0; i < rows.length; i++) {
            const cells = rows[i].getElementsByTagName("Cell");
            const cols = [];
            for (let j = 0; j < cells.length; j++) {
              cols.push(cells[j].textContent ? cells[j].textContent.trim() : "");
            }
            if (cols.length === 0 || cols[0].includes("날짜") || cols[0].includes("YYYY")) continue;
            if (!cols[0] || !cols[3]) continue;

            const formattedGrade = parseGradeStr(cols[1]);
            const classInfo = parseClassStr(cols[2]);
            const eventContent = cols[3];
            const eventCategory = cols[4] || classInfo.category || "학습";
            const eventManager = cols[5] ? cols[5] : (classInfo.manager || "");
            const eventPw = cols[6] || "1234";

            parsed.push({
              id: Math.floor(Date.now() + Math.random() * 1000000 + i) % 2147483647,
              date: cols[0].replace(/[./]/g, '-'),
              grade: formattedGrade,
              dept: classInfo.dept,
              content: eventContent,
              category: eventCategory,
              manager: eventManager,
              password: eventPw
            });
          }

          if (parsed.length === 0) {
            setCsvError("일정 데이터를 파싱하지 못했습니다. 파일 내용을 확인해 주세요.");
          } else {
            setCsvParsedData(parsed);
          }
          return;
        }

        // 일반 텍스트 CSV 파싱 처리
        const lines = text.split(/\r\n|\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length <= 1) {
          setCsvError("업로드한 파일에 유효한 데이터 행이 존재하지 않습니다.");
          return;
        }

        const parsed = [];
        for (let i = 0; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          if (cols[0].includes("날짜") || cols[0].includes("YYYY")) continue;
          if (!cols[0] || !cols[3]) continue;

          const formattedGrade = parseGradeStr(cols[1]);
          const classInfo = parseClassStr(cols[2]);
          const eventContent = cols[3];
          const eventCategory = cols[4] || classInfo.category || "학습";
          const eventManager = cols[5] ? cols[5] : (classInfo.manager || "");
          const eventPw = cols[6] || "1234";

          parsed.push({
            id: Math.floor(Date.now() + Math.random() * 1000000 + i) % 2147483647,
            date: cols[0].replace(/[./]/g, '-'),
            grade: formattedGrade,
            dept: classInfo.dept,
            content: eventContent,
            category: eventCategory,
            manager: eventManager,
            password: eventPw
          });
        }

        if (parsed.length === 0) {
          setCsvError("일정 데이터를 파싱하지 못했습니다. CSV 형식(날짜, 학년, 학급, 내용)을 확인해 주세요.");
        } else {
          setCsvParsedData(parsed);
        }
      } catch (err) {
        setCsvError("파일 분석 중 오류가 발생했습니다: " + err.message);
      }
    };
    reader.readAsText(file, "UTF-8");
  };

  const [eventModal, setEventModal] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [pwCheckInput, setPwCheckInput] = useState("");
  const [pwCheckError, setPwCheckError] = useState("");

  const fetchAllData = useCallback(async () => {
    if (!supabase) return;
    try {
      const { data: dbEvents } = await supabase.from('events').select('*');
      if (dbEvents) setEvents(dbEvents);
    } catch(e) {}
    try {
      const dbAdmin = await supabase.from('admin_status').select('*');
      if (dbAdmin) {
        dbAdmin.forEach(item => {
          if (item.week_key === 'custom_holidays_data') {
            setCustomHolidays(item.data || {});
            localStorage.setItem("sp_custom_holidays", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'notices_class_data') {
            setNotices(item.data || {});
            localStorage.setItem("sp_notices", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'class_passwords_data') {
            setClassPasswords(item.data || {});
            localStorage.setItem("sp_class_passwords", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'grade_configs_data') {
            setGradeConfigs(item.data || {});
            localStorage.setItem("sp_grade_configs", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'master_password_data') {
            if (item.data && item.data.password) {
              setMasterPassword(item.data.password);
              localStorage.setItem("sp_master_password", item.data.password);
            }
          } else if (item.week_key === 'today_pos_setting') {
            if (item.data && item.data.pos) {
              setTodayPosition(item.data.pos);
              localStorage.setItem("sp_today_pos", item.data.pos);
            }
          }
        });
      }
    } catch(e) {}
  }, [supabase]);

  useEffect(() => {
    fetchAllData();
    if (!supabase) return;
    const timer = setInterval(fetchAllData, 5000);
    return () => clearInterval(timer);
  }, [supabase, fetchAllData]);

  const filteredEvents = useMemo(() => {
    return events.filter((e) => {
      if (e.grade !== selectedGrade) return false;
      const cat = e.dept || "학습";
      if (cat === "학년 공통") {
        if (!selectedClass) return true;
        if (!e.manager || e.manager === "전체") return true;
        return e.manager.includes(selectedClass);
      }
      return selectedClass ? e.dept === selectedClass : false;
    });
  }, [events, selectedGrade, selectedClass]);

  const eventsByDate = useMemo(() => {
    const map = {};
    filteredEvents.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      const isDuplicate = map[e.date].some(item => item.id === e.id);
      if (!isDuplicate) {
        map[e.date].push(e);
      }
    });
    return map;
  }, [filteredEvents]);

  const todayStr = ymd(today);
  const todayEvents = useMemo(() => {
    return sortEvents(eventsByDate[todayStr] || []);
  }, [eventsByDate, todayStr]);

  const monthDays = getMonthDays(viewDate);
  const monthLabel = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  const weekDates = getWeekdays(weekAnchor);
  const weekStart = weekDates[0];
  const weekEnd = weekDates[4];
  const weekLabel = `${weekStart.getMonth() + 1}/${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;

  const handleToggleSelectEvent = (id) => {
    setSelectedEventIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const handleToggleSelectDate = (dateStr, dateEvents) => {
    const evIds = dateEvents.map(e => e.id);
    if (evIds.length === 0) return;
    const allChecked = evIds.every(id => selectedEventIds.has(id));

    setSelectedEventIds(prev => {
      const next = new Set(prev);
      evIds.forEach(id => {
        if (allChecked) next.delete(id);
        else next.add(id);
      });
      return next;
    });
  };

  const openDeleteModal = () => {
    if (selectedEventIds.size === 0) {
      alert("삭제할 일정을 체크박스로 선택해주세요.");
      return;
    }
    if (isAdminMode) {
      if (confirm(`관리자 권한으로 선택한 ${selectedEventIds.size}개의 일정을 즉시 삭제하시겠습니까?`)) {
        confirmBatchDelete(true);
      }
      return;
    }
    setDeletePwInput("");
    setDeletePwError("");
    setDeleteModalOpen(true);
  };

  const confirmBatchDelete = async (forceAdmin = false) => {
    if (!forceAdmin && !isAdminMode && deletePwInput !== currentClassPassword && deletePwInput !== masterPassword) {
      setDeletePwError("비밀번호가 일치하지 않습니다.");
      return;
    }

    const idsArr = Array.from(selectedEventIds);
    if (supabase) {
      await supabase.from('events').delete().in('id', idsArr);
    }
    setEvents(prev => prev.filter(ev => !selectedEventIds.has(ev.id)));
    setSelectedEventIds(new Set());
    setDeleteModalOpen(false);
    alert("선택한 일정이 안전하게 삭제되었습니다.");
  };

  const handlePrint = () => {
    const isMonth = tab === "month";
    const activeDays = isMonth ? monthDays : weekDates;
    const gNotice = (notices[gradeNoticeKey] || "").trim();
    const cNotice = (notices[classNoticeKey] || "").trim();

    const escapeToExcelCell = (str) => {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/\r\n|\n|\r/g, '<br style="mso-data-placement:same-cell;" />');
    };

    let htmlTableContent = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:x="urn:schemas-microsoft-com:office:excel"
            xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <style>
          table { border-collapse: collapse; width: 100%; table-layout: fixed; }
          th, td {
            border: 0.5pt solid #999;
            padding: 6px;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            font-size: 11pt;
            vertical-align: middle;
            mso-data-placement: same-cell;
            white-space: pre-wrap;
          }
          th { background-color: #f2f2f2; font-weight: bold; text-align: center; }
          .title { font-size: 16pt; font-weight: bold; text-align: center; border: none; padding-bottom: 15px; }
        </style>
      </head>
      <body>
        <table>
          <tr><td colspan="4" class="title">${selectedGrade} ${selectedClass || '전체 공통'} ${isMonth ? `${monthLabel} 행사 일정표` : `주간 행사 계획 (${weekLabel})`}</td></tr>
          <tr>
            <th style="width: 50px;">일자</th>
            <th style="width: 50px;">요일</th>
            <th style="width: 550px;">내용</th>
            <th style="width: 100px;">담당자</th>
          </tr>
    `;

    activeDays.forEach(d => {
      const dayNum = d.getDate();
      const dowStr = WEEKDAY_KOR[d.getDay()];
      const dStr = ymd(d);
      const hol = getHolidayName(dStr, customHolidays) || "";
      const evList = sortEvents(eventsByDate[dStr] || []);

      let contentRaw = "";
      let managerRaw = "";

      if (evList.length === 0) {
        contentRaw = hol ? `[휴일] ${hol}` : "";
        managerRaw = "";
      } else {
        const contents = [];
        const managers = [];
        evList.forEach(ev => {
          const badgeLabel = ev.dept || "학습";
          const isCommon = badgeLabel === "학년 공통";
          const targetStr = isCommon && ev.manager && ev.manager !== "전체" ? ` (${ev.manager})` : "";
          contents.push(`[${badgeLabel}] ${ev.content}${targetStr}`);
          managers.push(!isCommon && ev.manager ? ev.manager : "-");
        });
        contentRaw = contents.join("\n");
        managerRaw = managers.join("\n");
      }

      htmlTableContent += `
          <tr>
            <td style="text-align: center;">${dayNum}</td>
            <td style="text-align: center;">${dowStr}</td>
            <td>${escapeToExcelCell(contentRaw)}</td>
            <td style="text-align: center;">${escapeToExcelCell(managerRaw)}</td>
          </tr>
      `;
    });

    if (gNotice || cNotice) {
      const combinedNotices = [
        gNotice ? `[학년 공통]\n${gNotice}` : "",
        cNotice ? `[학급/전담]\n${cNotice}` : ""
      ].filter(Boolean).join("\n\n");

      htmlTableContent += `
          <tr>
            <td colspan="2" style="text-align: center; font-weight: bold; background-color: #f9fafb;">공지 및 협의</td>
            <td colspan="2">${escapeToExcelCell(combinedNotices)}</td>
          </tr>
      `;
    }

    htmlTableContent += `</table></body></html>`;

    const blob = new Blob(["\uFEFF" + htmlTableContent], { type: "application/vnd.ms-excel;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", `${selectedGrade}_${selectedClass || '공통'}_학급행사관리.xls`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const goPrev = () => (tab === "month" ? setViewDate((d) => addMonths(d, -1)) : setWeekAnchor((d) => addDays(d, -7)));
  const goNext = () => (tab === "month" ? setViewDate((d) => addMonths(d, 1)) : setWeekAnchor((d) => addDays(d, 7)));
  const goToday = () => {
    if (tab === "month") setViewDate(new Date());
    else setWeekAnchor(new Date());
  };

  const generateCycles = (baseDateStr, repeatType, endDateStr) => {
    if (repeatType === "none" || !baseDateStr || !endDateStr) {
      return [{ date: baseDateStr }];
    }
    const intervalDays = repeatType === "weekly" ? 7 : 14;
    const start = new Date(baseDateStr);
    const end = new Date(endDateStr);
    const cycles = [];
    let cur = new Date(start);

    while (cur <= end) {
      cycles.push({ date: ymd(cur) });
      cur = addDays(cur, intervalDays);
      if (cycles.length > 52) break;
    }
    return cycles.length > 0 ? cycles : [{ date: baseDateStr }];
  };

  const openAddEvent = (dateStr) => {
    const baseDate = dateStr || ymd(today);
    const defaultEnd = ymd(addMonths(new Date(baseDate), 1));
    const initialCycles = [{ date: baseDate }];

    if (copiedEvent) {
      setForm({
        targetGrade: selectedGrade,
        category: copiedEvent.category || "학년 공통",
        content: copiedEvent.content || "",
        manager: copiedEvent.manager || "",
        password: copiedEvent.password || "",
        schedules: [defaultScheduleRow(baseDate)],
        repeatType: "none",
        repeatEndDate: defaultEnd,
        repeatCycles: initialCycles
      });
    } else {
      setForm({
        ...emptyForm,
        targetGrade: selectedGrade,
        schedules: [defaultScheduleRow(baseDate)],
        repeatEndDate: defaultEnd,
        repeatCycles: initialCycles
      });
    }
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "add" });
  };

  const openEditEvent = (ev) => {
    const cat = ev.dept || "학습";
    const isGradeCommon = cat === "학년 공통";
    const isCustomTarget = isGradeCommon && ev.manager && ev.manager !== "전체";

    setForm({
      targetGrade: ev.grade || selectedGrade,
      category: cat,
      content: ev.content,
      manager: !isGradeCommon ? (ev.manager || "") : "",
      password: ev.password,
      schedules: [{
        date: ev.date,
        targetType: isCustomTarget ? "custom" : "all",
        selectedTargets: isCustomTarget ? ev.manager.split(", ") : [...activeClassList]
      }],
      repeatType: "none",
      repeatEndDate: ev.date,
      repeatCycles: [{ date: ev.date }]
    });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "edit", data: ev });
  };

  const copyCurrentEvent = () => {
    if (!form.content.trim()) return;
    setCopiedEvent({ 
      category: form.category, 
      content: form.content, 
      manager: form.manager, 
      password: form.password
    });
    setEventModal(null);
  };

  const addScheduleRow = () => {
    const lastRow = form.schedules[form.schedules.length - 1];
    const newDate = lastRow ? lastRow.date : ymd(today);
    setForm(prev => ({
      ...prev,
      schedules: [...prev.schedules, defaultScheduleRow(newDate)]
    }));
  };

  const removeScheduleRow = (index) => {
    if (form.schedules.length <= 1) return;
    setForm(prev => ({
      ...prev,
      schedules: prev.schedules.filter((_, idx) => idx !== index)
    }));
  };

  const updateScheduleRow = (index, field, value) => {
    setForm(prev => {
      const nextSchedules = [...prev.schedules];
      nextSchedules[index] = { ...nextSchedules[index], [field]: value };
      let nextCycles = prev.repeatCycles;
      if (index === 0 && field === "date" && prev.repeatType !== "none") {
        nextCycles = generateCycles(value, prev.repeatType, prev.repeatEndDate);
      }
      return { ...prev, schedules: nextSchedules, repeatCycles: nextCycles };
    });
  };

  const handleRepeatTypeChange = (newType) => {
    const baseDate = form.schedules[0]?.date || ymd(today);
    const cycles = generateCycles(baseDate, newType, form.repeatEndDate);
    setForm(prev => ({
      ...prev,
      repeatType: newType,
      repeatCycles: cycles
    }));
  };

  const handleRepeatEndDateChange = (newEndDate) => {
    const baseDate = form.schedules[0]?.date || ymd(today);
    const cycles = generateCycles(baseDate, form.repeatType, newEndDate);
    setForm(prev => ({
      ...prev,
      repeatEndDate: newEndDate,
      repeatCycles: cycles
    }));
  };

  const removeCycleItem = (cycleIdx) => {
    if (form.repeatCycles.length <= 1) {
      alert("최소 1개 이상의 회차가 유지되어야 합니다.");
      return;
    }
    setForm(prev => ({
      ...prev,
      repeatCycles: prev.repeatCycles.filter((_, idx) => idx !== cycleIdx)
    }));
  };

  const addManualCycle = () => {
    const lastCycle = form.repeatCycles[form.repeatCycles.length - 1];
    const nextDate = lastCycle ? ymd(addDays(new Date(lastCycle.date), 7)) : ymd(today);
    setForm(prev => ({
      ...prev,
      repeatCycles: [...prev.repeatCycles, { date: nextDate }]
    }));
  };

  const saveEvent = async () => {
    if (!form.content.trim()) {
      alert("행사 내용을 입력해주세요.");
      return;
    }
    const targetGrade = isAdminMode ? form.targetGrade : selectedGrade;
    const isGradeCommon = form.category === "학년 공통";
    const defaultTargetDept = selectedClass || (activeClassList[0] || "1반");
    const eventPassword = form.password.trim() || currentClassPassword;

    if (eventModal.mode === "add") {
      const newEvents = [];
      const baseRowDate = new Date(form.schedules[0].date);

      for (const cycle of form.repeatCycles) {
        const cycleDate = new Date(cycle.date);
        const dayDiff = Math.round((cycleDate - baseRowDate) / (1000 * 60 * 60 * 24));

        for (const row of form.schedules) {
          const rowDate = new Date(row.date);
          const targetDateObj = addDays(rowDate, dayDiff);
          const targetDateStr = ymd(targetDateObj);

          let finalManager = form.manager;
          if (isGradeCommon) {
            finalManager = row.targetType === "all" ? "전체" : row.selectedTargets.join(", ");
          }

          newEvents.push({
            id: Math.floor(Date.now() + Math.random() * 1000000) % 2147483647,
            date: targetDateStr,
            grade: targetGrade,
            dept: isGradeCommon ? "학년 공통" : defaultTargetDept,
            content: form.content,
            manager: finalManager,
            password: eventPassword
          });
        }
      }

      if (supabase) {
        const { error } = await supabase.from('events').insert(newEvents);
        if (error) {
          alert("저장 실패: " + error.message);
          return;
        }
      }
      setEvents(prev => [...prev, ...newEvents]);
      setEventModal(null);
      alert(`총 ${newEvents.length}건의 일정이 등록되었습니다.`);
    } else {
      if (!isAdminMode && pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword && pwCheckInput !== masterPassword) {
        setPwCheckError("비밀번호가 일치하지 않습니다.");
        return;
      }

      const row = form.schedules[0];
      let finalManager = form.manager;
      if (isGradeCommon) {
        finalManager = row.targetType === "all" ? "전체" : row.selectedTargets.join(", ");
      }

      const updatePayload = {
        date: row.date,
        grade: targetGrade,
        dept: isGradeCommon ? "학년 공통" : (eventModal.data.dept || defaultTargetDept),
        content: form.content,
        manager: finalManager
      };

      if (supabase) {
        const { error } = await supabase.from('events').update(updatePayload).eq('id', eventModal.data.id);
        if (error) {
          alert("수정 실패: " + error.message);
          return;
        }
      }
      setEvents(prev => prev.map(e => e.id === eventModal.data.id ? { ...e, ...updatePayload } : e));
      setEventModal(null);
      alert("일정이 성공적으로 수정되었습니다.");
    }
  };

  const deleteEvent = async () => {
    if (!isAdminMode && pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword && pwCheckInput !== masterPassword) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");
      return;
    }
    if (supabase) {
      await supabase.from('events').delete().eq('id', eventModal.data.id);
    }
    setEvents((prev) => prev.filter((e) => e.id !== eventModal.data.id));
    setEventModal(null);
  };

  const pwTargetClassList = useMemo(() => {
    const cfg = gradeConfigs[selectedPwGrade] || DEFAULT_CLASS_CONFIG;
    const classes = [];
    for (let i = 1; i <= cfg.classCount; i++) classes.push(`${i}반`);
    return [...classes, ...(cfg.specialists || [])];
  }, [selectedPwGrade, gradeConfigs]);

  const activeGradeNotice = notices[gradeNoticeKey] || "";
  const activeClassNotice = notices[classNoticeKey] || "";

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-32 sm:p-6 sm:pb-36">
      <div className="mx-auto max-w-3xl">
        {isAdminMode && (
          <div className="mb-4 flex items-center justify-between rounded-2xl bg-amber-500 px-4 py-2.5 text-white shadow-lg shadow-amber-200">
            <div className="flex items-center gap-2 text-xs font-bold truncate">
              <span className="rounded-lg bg-amber-700 px-2 py-0.5 shrink-0">MASTER ADMIN ON</span>
              <span className="truncate font-medium">마스터 관리자 모드 실행 중: 모든 학년/학급 일정을 비밀번호 없이 일괄 등록·관리할 수 있습니다.</span>
            </div>
            <button onClick={handleToggleAdminMode} className="ml-2 shrink-0 rounded-lg bg-amber-700 px-2.5 py-1 text-xs font-bold hover:bg-amber-800 transition">관리자 종료</button>
          </div>
        )}

        {copiedEvent && (
          <div className="mb-4 flex items-center justify-between rounded-xl bg-violet-600 px-4 py-2.5 text-white shadow-lg shadow-violet-200">
            <div className="flex items-center gap-2 text-xs truncate">
              <span className="rounded bg-violet-800 px-1.5 py-0.5 font-bold shrink-0">복사됨</span>
              <span className="truncate font-medium">"{copiedEvent.content}" (원하는 날짜의 '+' 버튼을 눌러 붙여넣기하세요)</span>
            </div>
            <button onClick={() => setCopiedEvent(null)} className="ml-2 shrink-0 rounded-lg bg-violet-700 px-2 py-0.5 text-xs hover:bg-violet-800">해제</button>
          </div>
        )}

        {/* 상단 헤더 패널 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-3">
            <div className="min-w-0 flex-1">
              <h1 className="text-xl font-extrabold text-slate-900 sm:text-2xl whitespace-nowrap overflow-hidden text-ellipsis mb-1">
                [{selectedGrade} {selectedClass ? selectedClass : "공통"}] 학급 및 전담 행사 관리 플래너
              </h1>
              <p className="text-xs text-slate-400">
                {selectedClass 
                  ? "개별 학급 전용 페이지입니다. 다른 반/전담 버튼을 누르면 해당 학급으로 즉시 이동합니다."
                  : "학년을 선택하셨습니다. 특정 반이나 전담 버튼을 눌러 입장해주세요."}
              </p>
            </div>

            {todayPosition === "header" && (
              <div className="shrink-0 flex flex-col items-start md:items-end justify-center rounded-xl bg-gradient-to-br from-violet-50 to-indigo-50/70 border border-violet-100 p-2.5 min-w-[200px] shadow-2xs">
                <div className="flex items-center gap-1.5 text-xs font-black text-violet-700 mb-1">
                  <span className="text-sm">📢</span>
                  <span>오늘의 행사 ({today.getMonth() + 1}/{today.getDate()} {WEEKDAY_KOR[today.getDay()]})</span>
                </div>
                {todayEvents.length === 0 ? (
                  <span className="text-[11px] text-slate-400 font-medium">등록된 행사 없음</span>
                ) : (
                  <div className="flex flex-wrap gap-1 max-w-[260px] justify-start md:justify-end">
                    {todayEvents.slice(0, 3).map((ev, i) => (
                      <span key={i} className="rounded bg-white/90 border border-violet-200 px-1.5 py-0.5 text-[11px] font-bold text-slate-700 truncate max-w-[220px]">
                        {ev.content}
                      </span>
                    ))}
                    {todayEvents.length > 3 && (
                      <span className="text-[10px] font-bold text-violet-600">+{todayEvents.length - 3}건</span>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="space-y-3 border-t border-slate-100 pt-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 mr-1.5">학년:</span>
                {GRADES.map(g => (
                  <button
                    key={g}
                    onClick={() => handleGradeClick(g)}
                    className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedGrade === g ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                  >
                    {g}
                  </button>
                ))}

                                    updateScheduleRow(idx, "selectedTargets", next);
                                  }}
                                  className={`rounded-lg px-2.5 py-1 text-xs font-bold border transition ${isChecked ? "bg-violet-600 text-white border-violet-600 shadow-2xs" : "bg-white text-slate-600 border-slate-200 hover:bg-violet-50"}`}
                                >
                                  {isChecked ? `✓ ${c}` : `+ ${c}`}
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              {eventModal.mode === "add" && (
                <div className="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-3.5 space-y-3">
                  <FieldLabel>주간 일정 반복 및 회차 관리</FieldLabel>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                      <span className="text-[11px] font-semibold text-slate-500 block mb-1">반복 주기</span>
                      <select 
                        value={form.repeatType} 
                        onChange={(e) => handleRepeatTypeChange(e.target.value)} 
                        className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 outline-none focus:border-indigo-400"
                      >
                        <option value="none">반복 없음 (1회만 등록)</option>
                        <option value="weekly">매주 반복 (1주 간격)</option>
                        <option value="biweekly">2주 간격 반복 (격주)</option>
                      </select>
                    </div>

                    {form.repeatType !== "none" && (
                      <div>
                        <span className="text-[11px] font-semibold text-slate-500 block mb-1">반복 종료 날짜</span>
                        <input 
                          type="date" 
                          value={form.repeatEndDate} 
                          onChange={(e) => handleRepeatEndDateChange(e.target.value)} 
                          className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 outline-none focus:border-indigo-400" 
                        />
                      </div>
                    )}
                  </div>

                  {form.repeatType !== "none" && (
                    <div className="space-y-2 border-t border-indigo-100 pt-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-extrabold text-indigo-900">
                          생성될 회차 목록 ({form.repeatCycles.length}회차)
                        </span>
                        <button
                          type="button"
                          onClick={addManualCycle}
                          className="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 transition flex items-center gap-0.5"
                        >
                          <PlusIcon size={12} /> 회차 수동 추가
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-40 overflow-y-auto p-1">
                        {form.repeatCycles.map((cycle, cIdx) => {
                          const cDate = new Date(cycle.date);
                          const dow = WEEKDAY_KOR[cDate.getDay()];
                          return (
                            <div key={cIdx} className="flex items-center justify-between rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 shadow-2xs">
                              <div className="flex items-center gap-1.5 min-w-0">
                                <span className="rounded bg-indigo-100 px-1.5 py-0.5 text-[10px] font-bold text-indigo-700 shrink-0">{cIdx + 1}회</span>
                                <span className="text-xs font-semibold text-slate-700 truncate">{cycle.date.slice(5)} ({dow})</span>
                              </div>
                              <button
                                type="button"
                                onClick={() => removeCycleItem(cIdx)}
                                className="rounded p-1 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition shrink-0 ml-1"
                                title="이 회차 제외/삭제"
                              >
                                <XIcon size={13} />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {!isAdminMode && (
                <div>
                  <FieldLabel>{eventModal.mode === "add" ? "비밀번호 (수정/삭제 시 사용할 비밀번호)" : "비밀번호"}</FieldLabel>
                  <input 
                    type="password" 
                    value={eventModal.mode === "add" ? form.password : pwCheckInput} 
                    onChange={(e) => eventModal.mode === "add" ? setForm({ ...form, password: e.target.value }) : setPwCheckInput(e.target.value)} 
                    className={inputCls} 
                    placeholder="비밀번호 입력" 
                  />
                </div>
              )}

              {pwCheckError && <p className="text-xs font-semibold text-rose-500">{pwCheckError}</p>}

              <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                {eventModal.mode === "edit" && (
                  <>
                    <button 
                      type="button" 
                      onClick={deleteEvent} 
                      className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-100 transition"
                    >
                      <Trash2Icon size={15} /> 삭제
                    </button>
                    <button 
                      type="button" 
                      onClick={copyCurrentEvent} 
                      className="flex items-center gap-1 rounded-xl border border-violet-200 bg-violet-50 px-3 py-2.5 text-sm font-bold text-violet-600 hover:bg-violet-100 transition"
                    >
                      <CopyIcon size={15} /> 복사
                    </button>
                  </>
                )}
                <button 
                  type="button" 
                  onClick={() => setEventModal(null)} 
                  className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"
                >
                  취소
                </button>
                <button 
                  type="button" 
                  onClick={saveEvent} 
                  className={`flex-1 rounded-xl py-2.5 text-sm font-bold text-white transition shadow-md ${isAdminMode ? "bg-amber-500 hover:bg-amber-600 shadow-amber-200" : "bg-violet-600 hover:bg-violet-700 shadow-violet-200"}`}
                >
                  {eventModal.mode === "add" ? (isAdminMode ? "👑 관리자 일괄 등록" : "일괄 추가하기") : "수정하기"}
                </button>
              </div>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
