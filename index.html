function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const startOfWeekMon = (d) => { const r = new Date(d); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(r, diff); };

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function getHolidayName(dateStr, customHolidays) {
  if (customHolidays && customHolidays[dateStr]) return customHolidays[dateStr];
  if (FIXED_HOLIDAYS[dateStr]) return FIXED_HOLIDAYS[dateStr];
  const mmdd = dateStr.slice(5);
  if (FIXED_HOLIDAYS[mmdd]) return FIXED_HOLIDAYS[mmdd];
  return null;
}

function sortEvents(events) {
  const catOrder = EVENT_CATEGORIES;
  return [...events].sort((a, b) => {
    const catA = a.dept || "학습";
    const catB = b.dept || "학습";
    const idxA = catOrder.indexOf(catA);
    const idxB = catOrder.indexOf(catB);
    if (idxA !== idxB) return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
    return (a.content || "").localeCompare(b.content || "", "ko");
  });
}

            {holidayName}

        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {sortedEvents.length === 0 ? (

        ) : (
          sortedEvents.map((ev) => {

  const [eventModal, setEventModal] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [pwCheckInput, setPwCheckInput] = useState("");
  const [pwCheckError, setPwCheckError] = useState("");

  const fetchAllData = useCallback(async () => {
    try {
      const dbEvents = await sbFetch('events', 'GET', null, '?select=*');
      if (dbEvents) setEvents(dbEvents);
    } catch(e) {}
    try {
      const dbAdmin = await sbFetch('admin_status', 'GET', null, '?select=*');
      if (dbAdmin) {
        dbAdmin.forEach(item => {
          if (item.week_key === 'custom_holidays_data') {
            setCustomHolidays(item.data || {});
            localStorage.setItem("sp_custom_holidays", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'notices_class_data') {
            setNotices(item.data || {});
            localStorage.setItem("sp_notices", JSON.stringify(item.data || {}));
          } else if (item.week_key === 'class_passwords_data') {
            setClassPasswords(item.data || {});
            localStorage.setItem("sp_class_passwords", JSON.stringify(item.data || {}));
          }
        });
      }
    } catch(e) {}
  }, []);

  useEffect(() => {
    fetchAllData();
    const timer = setInterval(fetchAllData, 5000);
    return () => clearInterval(timer);
  }, [fetchAllData]);

  const filteredEvents = useMemo(() => {
    return events.filter((e) => {
      if (e.grade !== selectedGrade) return false;
      const cat = e.dept || "학습";
      if (cat === "학년 공통") {
        if (!e.manager || e.manager === "전체") return true;
        return e.manager.includes(selectedClass);
      }
      return e.dept === selectedClass;
    });
  }, [events, selectedGrade, selectedClass]);

  const eventsByDate = useMemo(() => {
    const map = {};
    filteredEvents.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      const isDuplicate = map[e.date].some(item => item.id === e.id || (item.content === e.content && item.dept === e.dept && item.date === e.date));
      if (!isDuplicate) {
        map[e.date].push(e);
      }
    });
    return map;
  }, [filteredEvents]);

  const monthDays = getMonthDays(viewDate);
  const monthLabel = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  const weekDates = getWeekdays(weekAnchor);
  const weekStart = weekDates[0];
  const weekEnd = weekDates[4];
  const weekLabel = `${weekStart.getMonth() + 1}/${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;

  const handleToggleSelectEvent = (id) => {
    setSelectedEventIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const handleToggleSelectDate = (dateStr, dateEvents) => {
    const evIds = dateEvents.map(e => e.id);
    if (evIds.length === 0) return;
    const allChecked = evIds.every(id => selectedEventIds.has(id));

    setSelectedEventIds(prev => {
      const next = new Set(prev);
      evIds.forEach(id => {
        if (allChecked) next.delete(id);
        else next.add(id);
      });
      return next;
    });
  };

  const openDeleteModal = () => {
    if (selectedEventIds.size === 0) {
      alert("삭제할 일정을 체크박스로 선택해주세요.");
      return;
    }
    setDeletePwInput("");
    setDeletePwError("");
    setDeleteModalOpen(true);
  };

  const confirmBatchDelete = async () => {
    if (deletePwInput !== currentClassPassword) {
      setDeletePwError("비밀번호가 일치하지 않습니다.");
      return;
    }

    const idsArr = Array.from(selectedEventIds);
    try {
      for (const id of idsArr) {
        await sbFetch('events', 'DELETE', null, `?id=eq.${id}`);
      }
    } catch(e) {}
    setEvents(prev => prev.filter(ev => !selectedEventIds.has(ev.id)));
    setSelectedEventIds(new Set());
    setDeleteModalOpen(false);
    alert("선택한 일정이 안전하게 삭제되었습니다.");
  };

  const handlePrint = () => {
    const isMonth = tab === "month";
    const activeDays = isMonth ? monthDays : weekDates;
    const currentNoticeText = (notices[currentPeriodKey] || "").trim();

    const escapeToExcelCell = (str) => {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/\r\n|\n|\r/g, '<br style="mso-data-placement:same-cell;" />');
    };

    let htmlTableContent = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:x="urn:schemas-microsoft-com:office:excel"
            xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <style>
          table { border-collapse: collapse; width: 100%; table-layout: fixed; }
          th, td {
            border: 0.5pt solid #999;
            padding: 6px;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            font-size: 11pt;
            vertical-align: middle;
            mso-data-placement: same-cell;
            white-space: pre-wrap;
          }
          th { background-color: #f2f2f2; font-weight: bold; text-align: center; }
          .title { font-size: 16pt; font-weight: bold; text-align: center; border: none; padding-bottom: 15px; }
        </style>
      </head>
      <body>
        <table>
          <tr><td colspan="4" class="title">${selectedGrade} ${selectedClass} ${isMonth ? `${monthLabel} 학급 행사 일정표` : `주간 행사 계획 (${weekLabel})`}</td></tr>
          <tr>
            <th style="width: 50px;">일자</th>
            <th style="width: 50px;">요일</th>
            <th style="width: 550px;">내용</th>
            <th style="width: 100px;">담당자</th>
          </tr>
    `;

    activeDays.forEach(d => {
      const dayNum = d.getDate();
      const dowStr = WEEKDAY_KOR[d.getDay()];
      const dStr = ymd(d);
      const hol = getHolidayName(dStr, customHolidays) || "";
      const evList = sortEvents(eventsByDate[dStr] || []);

      let contentRaw = "";
      let managerRaw = "";

      if (evList.length === 0) {
        contentRaw = hol ? `[휴일] ${hol}` : "";
        managerRaw = "";
      } else {
        const contents = [];
        const managers = [];
        evList.forEach(ev => {
          const badgeLabel = ev.dept || "학습";
          contents.push(`[${badgeLabel}] ${ev.content}`);
          managers.push(ev.manager ? ev.manager : "-");
        });
        contentRaw = contents.join("\n");
        managerRaw = managers.join("\n");
      }

      htmlTableContent += `
          <tr>
            <td style="text-align: center;">${dayNum}</td>
            <td style="text-align: center;">${dowStr}</td>
            <td>${escapeToExcelCell(contentRaw)}</td>
            <td style="text-align: center;">${escapeToExcelCell(managerRaw)}</td>
          </tr>
      `;
    });

    if (currentNoticeText) {
      htmlTableContent += `
          <tr>
            <td colspan="2" style="text-align: center; font-weight: bold; background-color: #f9fafb;">공지 및 협의</td>
            <td colspan="2">${escapeToExcelCell(currentNoticeText)}</td>
          </tr>
      `;
    }

    htmlTableContent += `</table></body></html>`;

    const blob = new Blob(["\uFEFF" + htmlTableContent], { type: "application/vnd.ms-excel;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", `${selectedGrade}_${selectedClass}_학급행사관리.xls`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const goPrev = () => (tab === "month" ? setViewDate((d) => addMonths(d, -1)) : setWeekAnchor((d) => addDays(d, -7)));
  const goNext = () => (tab === "month" ? setViewDate((d) => addMonths(d, 1)) : setWeekAnchor((d) => addDays(d, 7)));
  const goToday = () => {
    if (tab === "month") setViewDate(new Date());
    else setWeekAnchor(new Date());
  };

  const openAddEvent = (dateStr) => {
    if (copiedEvent) {
      setForm({
        date: dateStr || ymd(today),
        category: copiedEvent.category || "학습",
        content: copiedEvent.content || "",
        manager: copiedEvent.manager || "",
        password: copiedEvent.password || "",
        targetType: copiedEvent.targetType || "all",
        selectedTargets: copiedEvent.selectedTargets || []
      });
    } else {
      setForm({ ...emptyForm, date: dateStr || ymd(today), selectedTargets: [...classList] });
    }
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "add" });
  };

  const openEditEvent = (ev) => {
    const cat = ev.dept || "학습";
    setForm({
      date: ev.date,
      category: cat,
      content: ev.content,
      manager: ev.manager || "",
      password: ev.password,
      targetType: ev.manager && ev.manager !== "전체" ? "custom" : "all",
      selectedTargets: ev.manager && ev.manager !== "전체" ? ev.manager.split(", ") : [...classList]
    });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "edit", data: ev });
  };

  const copyCurrentEvent = () => {
    if (!form.content.trim()) return;
    setCopiedEvent({ 
      category: form.category, 
      content: form.content, 
      manager: form.manager, 
      password: form.password, 
      targetType: form.targetType,
      selectedTargets: form.selectedTargets
    });
    setEventModal(null);
  };

  const saveEvent = async () => {
    if (!form.content.trim()) return;
    const isGradeCommon = form.category === "학년 공통";
    const eventPassword = form.password.trim() || currentClassPassword;

    let finalManager = form.manager;
    if (isGradeCommon) {
      if (form.targetType === "all") {
        finalManager = "전체";
      } else {
        finalManager = form.selectedTargets.join(", ");
      }
    }

    if (eventModal.mode === "add") {
      const newEv = {
        id: Math.floor(Date.now() % 2147483647),
        date: form.date,
        grade: selectedGrade,
        dept: isGradeCommon ? "학년 공통" : selectedClass,
        content: form.content,
        manager: finalManager,
        password: eventPassword
      };

      try {
        await sbFetch('events', 'POST', newEv);
      } catch (error) {
        alert("저장 실패: " + error.message);
        return;
      }
      setEvents(prev => [...prev, newEv]);
      setEventModal(null);
    } else {
      if (pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword) {
        setPwCheckError("비밀번호가 일치하지 않습니다.");
        return;
      }
      const updatePayload = {
        date: form.date,
        dept: isGradeCommon ? "학년 공통" : selectedClass,
        content: form.content,
        manager: finalManager
      };
      try {
        await sbFetch('events', 'PATCH', updatePayload, `?id=eq.${eventModal.data.id}`);
      } catch (error) {
        alert("수정 실패: " + error.message);
        return;
      }
      setEvents((prev) => prev.map((e) => (e.id === eventModal.data.id ? { ...e, ...updatePayload } : e)));
      setEventModal(null);
    }
  };

  const deleteEvent = async () => {
    if (pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");
      return;
    }
    try {
      await sbFetch('events', 'DELETE', null, `?id=eq.${eventModal.data.id}`);
    } catch(e) {}
    setEvents((prev) => prev.filter((e) => e.id !== eventModal.data.id));
    setEventModal(null);
  };

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-32 sm:p-6 sm:pb-36">
      <div className="mx-auto max-w-3xl">
        {copiedEvent && (
          <div className="mb-4 flex items-center justify-between rounded-xl bg-violet-600 px-4 py-2.5 text-white shadow-lg shadow-violet-200">
            <div className="flex items-center gap-2 text-xs truncate">
              <span className="rounded bg-violet-800 px-1.5 py-0.5 font-bold shrink-0">복사됨</span>
              <span className="truncate font-medium">"{copiedEvent.content}" (원하는 날짜의 '+' 버튼을 눌러 붙여넣기하세요)</span>
            </div>
            <button onClick={() => setCopiedEvent(null)} className="ml-2 shrink-0 rounded-lg bg-violet-700 px-2 py-0.5 text-xs hover:bg-violet-800">해제</button>
          </div>
        )}

        {/* 헤더 및 학년·반 선택 및 저장 바 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
            <div>
              <h1 className="text-xl font-extrabold text-slate-900 sm:text-2xl mb-1">
                [{selectedGrade} {selectedClass}] 학급 및 전담 행사 관리 플래너
              </h1>
              <p className="text-xs text-slate-400">상단에서 학년과 반을 선택한 뒤 [저장 (전환하기)] 버튼을 눌러주세요.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => { setHolidayCalendarDate(new Date()); setSelectedHolidayDate(ymd(new Date())); setHolidayNameInput("재량휴업일"); setHolidayModalOpen(true); }}
                className="flex items-center gap-1 shrink-0 rounded-full border border-rose-200 bg-white px-3 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 transition shadow-2xs"
              >
                <span>🏖️</span> 휴일 관리
              </button>
            </div>
          </div>

          {/* 학년 및 반 선택 패널 및 저장 버튼 */}
          <div className="space-y-3 border-t border-slate-100 pt-3">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-xs font-bold text-slate-500 mr-2">학년 선택:</span>
              {GRADES.map(g => (
                <button
                  key={g}
                  onClick={() => setTempGrade(g)}
                  className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tempGrade === g ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                >
                  {g}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 mr-2">학급/전담 선택:</span>
                {classList.map(c => (
                  <button
                    key={c}
                    onClick={() => setTempClass(c)}
                    className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tempClass === c ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                  >
                    {c}
                  </button>
                ))}
                <button
                  onClick={() => { setNewClassInput(""); setAddClassModalOpen(true); }}
                  className="rounded-lg border border-dashed border-violet-300 bg-violet-50 px-2.5 py-1.5 text-xs font-bold text-violet-600 hover:bg-violet-100 transition flex items-center gap-1"
                >
                  <PlusIcon size={12} /> 추가
                </button>
              </div>
              <button
                onClick={handleSaveAndSwitchClass}
                className="rounded-xl bg-violet-600 px-4 py-2 text-xs font-bold text-white shadow-sm hover:bg-violet-700 transition shrink-0"
              >
                저장 (전환하기)
              </button>
            </div>
          </div>
        </div>

        {/* 탭 & 출력/저장 & 날짜 이동 바 */}
        <div className="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white p-2 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-wrap items-center gap-2">
            <div className="flex gap-1 rounded-xl bg-slate-100 p-1">
              <button onClick={() => setTab("month")} className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${tab === "month" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                <CalendarDaysIcon size={15} /> 월별 일정
              </button>
              <button onClick={() => setTab("week")} className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${tab === "week" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                <ClipboardListIcon size={15} /> 주간 행사 계획
              </button>
            </div>

            <button onClick={handlePrint} className="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50 px-3.5 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-100 transition shadow-xs" title="출력 및 엑셀 저장">
              <PrinterIcon size={14} className="text-violet-500" />
              <span>출력/저장</span>
            </button>
          </div>

          <div className="flex items-center gap-2">
            <button onClick={goPrev} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600"><ChevronLeft size={18} /></button>
            <span className="min-w-[90px] text-center text-sm font-bold text-slate-700">{tab === "month" ? monthLabel : weekLabel}</span>
            <button onClick={goNext} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600"><ChevronRight size={18} /></button>
            <button onClick={goToday} className="ml-1 rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-50">오늘</button>
          </div>
        </div>

        {/* 공지 및 협의사항 입력 공간 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="mb-2 flex items-center justify-between">
            <span className="text-xs font-bold text-slate-700">공지 및 협의사항 ({selectedGrade} {selectedClass})</span>
            <div className="flex gap-1.5">
              {!isNoticeEditing ? (
                <button onClick={handleToggleNoticeEdit} className="rounded-lg bg-violet-100 px-3 py-1 text-xs font-bold text-violet-700 hover:bg-violet-200 transition shadow-2xs">글쓰기/수정</button>
              ) : (
                <>
                  <button onClick={handleSaveNotice} className="rounded-lg bg-violet-500 px-3 py-1 text-xs font-bold text-white hover:bg-violet-600 transition shadow-2xs">저장</button>
                  <button onClick={handleDeleteNotice} className="rounded-lg bg-rose-50 px-3 py-1 text-xs font-bold text-rose-600 hover:bg-rose-100 transition">삭제</button>
                </>
              )}
            </div>
          </div>
          <textarea
            value={noticeInput}
            onChange={(e) => isNoticeEditing && setNoticeInput(e.target.value)}
            readOnly={!isNoticeEditing}
            rows={2}
            className={`w-full rounded-xl border px-3 py-2 text-sm outline-none transition resize-y min-h-[50px] ${isNoticeEditing ? "border-violet-400 bg-white ring-2 ring-violet-100 text-slate-700" : "border-slate-200 bg-slate-50 text-slate-500 cursor-default"}`}
            placeholder="예) 학급/전담 알림장 및 전달 사항"
          />
        </div>

        {/* 선택 삭제 및 일정 추가 버튼 바 */}
        <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div className="ml-auto flex items-center gap-2">
            {selectedEventIds.size > 0 && (
              <button
                onClick={openDeleteModal}
                className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-bold text-rose-600 shadow-sm hover:bg-rose-100 transition animate-pulse"
              >
                <Trash2Icon size={14} /> 선택 삭제 ({selectedEventIds.size})
              </button>
            )}
            <button
              onClick={() => openAddEvent(tab === "month" ? ymd(today) : ymd(weekDates[0]))}
              className="flex items-center gap-1 rounded-xl bg-violet-500 px-3 py-2 text-xs font-bold text-white shadow-sm shadow-violet-200 hover:bg-violet-600 transition"
            >
              <PlusIcon size={14} /> 일정 추가
            </button>
          </div>
        </div>

        {/* 캘린더 리스트 본문 */}
        <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 mb-8">
          {(tab === "month" ? monthDays : weekDates).map((d, idx) => {
            const dStr = ymd(d);
            const dayEvents = eventsByDate[dStr] || [];
            const evIds = dayEvents.map(e => e.id);
            const isDateSelected = evIds.length > 0 && evIds.every(id => selectedEventIds.has(id));

            return (
              <DateRow
                key={dStr}
                date={d}
                today={today}
                events={dayEvents}
                isLast={idx === (tab === "month" ? monthDays : weekDates).length - 1}
                onAddEvent={openAddEvent}
                onOpenEvent={openEditEvent}
                customHolidays={customHolidays}
                selectedEventIds={selectedEventIds}
                onToggleSelectEvent={handleToggleSelectEvent}
                onToggleSelectDate={handleToggleSelectDate}
                isDateSelected={isDateSelected}
              />
            );
          })}
        </div>

        {/* 학급/전담 추가 모달 */}
        {addClassModalOpen && (
          <Modal title="새 학급 또는 전담 추가" onClose={() => setAddClassModalOpen(false)}>
            <p className="mb-3 text-xs text-slate-500 leading-relaxed">
              사용할 명칭을 자유롭게 입력해주세요. (예: <b>영어 전담</b>, <b>과학 전담</b>, <b>특수반</b> 등)
            </p>
            <FieldLabel>명칭 입력</FieldLabel>
            <input
              type="text"
              autoFocus
              value={newClassInput}
              onChange={(e) => setNewClassInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleAddClassOrSubject()}
              className={inputCls}
              placeholder="예) 영어 전담"
            />
            <div className="mt-4 flex items-center gap-2">
              <button onClick={() => setAddClassModalOpen(false)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={handleAddClassOrSubject} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">추가하기</button>
            </div>
          </Modal>
        )}

        {/* 학급 전환 비밀번호 인증 모달 */}
        {switchModalOpen && (
          <Modal title={`${tempGrade} ${tempClass} 전환 인증`} onClose={() => setSwitchModalOpen(false)}>
            <p className="mb-3 text-xs text-slate-500 leading-relaxed">
              {isSettingNewPw 
                ? `처음 접속하는 곳입니다. 사용할 비밀번호를 설정해주세요.`
                : `해당 담당자가 설정한 비밀번호를 입력해주세요.`}
            </p>
            {isSettingNewPw ? (
              <div className="space-y-3">
                <div>
                  <FieldLabel>새 비밀번호 설정</FieldLabel>
                  <input type="password" autoFocus value={newPwInput} onChange={(e) => setNewPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && confirmSwitchClass()} className={inputCls} placeholder="비밀번호 입력" />
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                <div>
                  <FieldLabel>비밀번호</FieldLabel>
                  <input type="password" autoFocus value={switchPwInput} onChange={(e) => setSwitchPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && confirmSwitchClass()} className={inputCls} placeholder="비밀번호 입력" />
                </div>
              </div>
            )}
            {switchError && <p className="mt-2 text-xs font-semibold text-rose-500">{switchError}</p>}
            <div className="mt-4 flex items-center gap-2">
              <button onClick={() => setSwitchModalOpen(false)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={confirmSwitchClass} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">전환하기</button>
            </div>
          </Modal>
        )}

        {/* 선택 삭제 인증 모달 */}
        {deleteModalOpen && (
          <Modal title="선택 삭제 확인" onClose={() => setDeleteModalOpen(false)}>
            <p className="mb-3 text-xs text-slate-500 leading-relaxed">
              선택한 <b>{selectedEventIds.size}개</b>의 일정을 삭제하려면 비밀번호를 입력해주세요.
            </p>
            <FieldLabel>비밀번호</FieldLabel>
            <input
              type="password"
              autoFocus
              value={deletePwInput}
              onChange={(e) => setDeletePwInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && confirmBatchDelete()}
              className={inputCls}
              placeholder="비밀번호 입력"
            />
            {deletePwError && <p className="mt-2 text-xs font-semibold text-rose-500">{deletePwError}</p>}
            <div className="mt-4 flex items-center gap-2">
              <button onClick={() => setDeleteModalOpen(false)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={confirmBatchDelete} className="flex-1 rounded-xl bg-rose-500 py-2.5 text-sm font-bold text-white hover:bg-rose-600 transition shadow-md shadow-rose-200">삭제 확인</button>
            </div>
          </Modal>
        )}

        {/* 재량휴업일 관리 모달 */}
        {holidayModalOpen && (
          <Modal title="학교 휴일 및 재량휴업일 관리" onClose={() => setHolidayModalOpen(false)} wide>
            <div className="space-y-4">
              <div className="flex items-center justify-between rounded-xl bg-rose-50/70 p-3 border border-rose-100">
                <button onClick={() => setHolidayCalendarDate(prev => addMonths(prev, -1))} className="rounded-lg bg-white p-1.5 text-rose-600 shadow-2xs hover:bg-rose-100 transition"><ChevronLeft size={16} /></button>
                <span className="text-sm font-extrabold text-rose-800">{holidayCalendarDate.getFullYear()}년 {holidayCalendarDate.getMonth() + 1}월</span>
                <button onClick={() => setHolidayCalendarDate(prev => addMonths(prev, 1))} className="rounded-lg bg-white p-1.5 text-rose-600 shadow-2xs hover:bg-rose-100 transition"><ChevronRight size={16} /></button>
              </div>

              <div className="rounded-xl border border-slate-200 bg-white p-3 shadow-2xs">
                <div className="grid grid-cols-7 gap-1 text-center mb-1">
                  {["일", "월", "화", "수", "목", "금", "토"].map((w, i) => (
                    <span key={w} className={`text-xs font-bold ${i === 0 ? "text-rose-500" : i === 6 ? "text-blue-500" : "text-slate-500"}`}>{w}</span>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-1 text-center">
                  {(() => {
                    const y = holidayCalendarDate.getFullYear();
                    const m = holidayCalendarDate.getMonth();
                    const firstDayIdx = new Date(y, m, 1).getDay();
                    const lastDate = new Date(y, m + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < firstDayIdx; i++) cells.push(<div key={`empty-${i}`} className="h-8"></div>);
                    for (let d = 1; d <= lastDate; d++) {
                      const dObj = new Date(y, m, d);
                      const dStr = ymd(dObj);
                      const isSelected = selectedHolidayDate === dStr;
                      const hasHol = !!customHolidays[dStr];
                      const dow = dObj.getDay();
                      cells.push(
                        <button
                          key={dStr}
                          onClick={() => { setSelectedHolidayDate(dStr); if (hasHol) setHolidayNameInput(customHolidays[dStr]); }}
                          className={`h-9 rounded-lg text-xs font-bold flex flex-col items-center justify-center transition relative ${isSelected ? "bg-rose-600 text-white shadow-sm ring-2 ring-rose-300" : hasHol ? "bg-rose-100 text-rose-700 border border-rose-300" : dow === 0 ? "text-rose-500 hover:bg-slate-100" : dow === 6 ? "text-blue-500 hover:bg-slate-100" : "text-slate-700 hover:bg-slate-100"}`}
                        >
                          <span>{d}</span>
                          {hasHol && <span className="absolute bottom-0.5 h-1 w-1 rounded-full bg-rose-500"></span>}
                        </button>
                      );
                    }
                    return cells;
                  })()}
                </div>
              </div>

              <div className="rounded-xl border border-slate-200 bg-slate-50 p-3 flex flex-col sm:flex-row items-center gap-2">
                <span className="text-xs font-bold text-slate-700">선택일: {selectedHolidayDate}</span>
                <input type="text" value={holidayNameInput} onChange={(e) => setHolidayNameInput(e.target.value)} placeholder="휴일 명칭 (예: 재량휴업일)" className="flex-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-700 outline-none" />
                <button
                  onClick={async () => {
                    if (!selectedHolidayDate || !holidayNameInput.trim()) return;
                    const updated = { ...customHolidays, [selectedHolidayDate]: holidayNameInput.trim() };
                    setCustomHolidays(updated);
                    localStorage.setItem("sp_custom_holidays", JSON.stringify(updated));
                    try {
                      await sbFetch('admin_status', 'POST', { week_key: 'custom_holidays_data', data: updated }, '?on_conflict=week_key');
                    } catch(e) {}
                    alert("등록되었습니다.");
                  }}
                  className="w-full sm:w-auto rounded-lg bg-rose-500 px-4 py-2 text-xs font-bold text-white hover:bg-rose-600 transition shadow-sm"
                >
                  등록/수정
                </button>
              </div>

              <button onClick={() => setHolidayModalOpen(false)} className="w-full rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 transition">닫기</button>
            </div>
          </Modal>
        )}

        {/* 일정 추가/수정 모달 */}
        {eventModal && (
          <Modal title={eventModal.mode === "add" ? "일정 추가" : "일정 수정"} onClose={() => setEventModal(null)} wide>
            <div className="space-y-3">
              <div>
                <FieldLabel>날짜</FieldLabel>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} />
              </div>
              <div>
                <FieldLabel>일정 분야</FieldLabel>
                <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className={inputCls}>
                  {EVENT_CATEGORIES.map((cat) => ( <option key={cat} value={cat}>{cat}</option> ))}
                </select>
              </div>

              {form.category === "학년 공통" && (
                <div className="rounded-xl border border-violet-100 bg-violet-50/50 p-3.5 space-y-2.5">
                  <FieldLabel>학년 공통 적용 대상</FieldLabel>
                  <div className="flex gap-4">
                    <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer">
                      <input 
                        type="radio" 
                        name="targetType" 
                        checked={form.targetType === "all"} 
                        onChange={() => setForm({ ...form, targetType: "all" })}
                        className="text-violet-600 focus:ring-violet-400"
                      />
                      전체 등록 (모든 반 및 전담)
                    </label>
                    <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer">
                      <input 
                        type="radio" 
                        name="targetType" 
                        checked={form.targetType === "custom"} 
                        onChange={() => setForm({ ...form, targetType: "custom", selectedTargets: [...classList] })}
                        className="text-violet-600 focus:ring-violet-400"
                      />
                      특정 학급/전담 지정
                    </label>
                  </div>

                  {form.targetType === "custom" && (
                    <div className="pt-2 border-t border-violet-200/60 flex flex-wrap gap-2">
                      {classList.map(c => {
                        const isChecked = form.selectedTargets.includes(c);
                        return (
                          <button
                            key={c}
                            type="button"
                            onClick={() => {
                              const next = isChecked ? form.selectedTargets.filter(item => item !== c) : [...form.selectedTargets, c];
                              setForm({ ...form, selectedTargets: next });
                            }}
                            className={`rounded-lg px-2.5 py-1 text-xs font-bold border transition ${isChecked ? "bg-violet-600 text-white border-violet-600 shadow-2xs" : "bg-white text-slate-600 border-slate-200 hover:bg-violet-50"}`}
                          >
                            {isChecked ? `✓ ${c}` : `+ ${c}`}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              <div>
                <FieldLabel>행사 내용</FieldLabel>
                <textarea value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} rows={2} className={inputCls} placeholder="예) 현장체험학습 (서울랜드)" />
              </div>
              <div>
                <FieldLabel>담당자 (선택)</FieldLabel>
                <input type="text" value={form.manager} onChange={(e) => setForm({ ...form, manager: e.target.value })} className={inputCls} placeholder="예) 홍길동" />
              </div>
              {eventModal.mode === "add" ? (
                <div>
                  <FieldLabel>비밀번호 (수정/삭제 시 사용할 비밀번호)</FieldLabel>
                  <input type="password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} className={inputCls} placeholder="미입력 시 기본 비밀번호 적용" />
                </div>
              ) : (
                <div>
                  <FieldLabel>비밀번호</FieldLabel>
                  <input type="password" value={pwCheckInput} onChange={(e) => setPwCheckInput(e.target.value)} className={inputCls} placeholder="비밀번호 입력" />
                </div>
              )}
              {pwCheckError && <p className="text-xs font-semibold text-rose-500">{pwCheckError}</p>}
              <div className="flex items-center gap-2 pt-1">
                {eventModal.mode === "edit" && (
                  <>
                    <button onClick={deleteEvent} className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-100 transition"><Trash2Icon size={15} /> 삭제</button>
                    <button onClick={copyCurrentEvent} className="flex items-center gap-1 rounded-xl border border-violet-200 bg-violet-50 px-3 py-2.5 text-sm font-bold text-violet-600 hover:bg-violet-100 transition"><CopyIcon size={15} /> 복사</button>
                  </>
                )}
                <button onClick={() => setEventModal(null)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">C취소</button>
                <button onClick={saveEvent} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">{eventModal.mode === "add" ? "추가" : "수정"}</button>
              </div>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
