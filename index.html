function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const startOfWeekMon = (d) => { const r = new Date(d); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(r, diff); };

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function sortEvents(events) {
  const catOrder = EVENT_CATEGORIES;
  return [...events].sort((a, b) => {
    const catA = a.dept || "학습";
    const catB = b.dept || "학습";
    const idxA = catOrder.indexOf(catA);
    const idxB = catOrder.indexOf(catB);
    if (idxA !== idxB) return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
    return (a.content || "").localeCompare(b.content || "", "ko");
  });
}

function DateRow({ date, today, events, isLast, onAddEvent, onOpenEvent, customHolidays, selectedEventIds, onToggleSelectEvent, onToggleSelectDate, isDateSelected }) {
  const dateStr = ymd(date);
  const dow = date.getDay();
  const isToday = sameDay(date, today);
  const holidayName = (customHolidays && customHolidays[dateStr]) || FIXED_HOLIDAYS[dateStr] || FIXED_HOLIDAYS[dateStr.slice(5)] || null;
  const isHoliday = dow === 0 || !!holidayName;

  const rowBg = isToday ? "bg-emerald-50/70" : isHoliday ? "bg-rose-50/40" : dow === 6 ? "bg-blue-50/30" : "bg-white";
  const dateColor = isToday ? "text-emerald-600" : isHoliday ? "text-rose-500 font-black" : dow === 6 ? "text-blue-400" : "text-slate-500";
  const sortedEvents = sortEvents(events);

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 min-h-[52px] ${rowBg} ${isLast ? "border-b-0" : ""}`}>
      <div className={`flex w-16 shrink-0 flex-col items-start pt-0.5 sm:w-20 ${dateColor}`}>
        <div className="flex items-center gap-1.5 mb-1">
          <input
            type="checkbox"
            checked={isDateSelected}
            onChange={() => onToggleSelectDate(dateStr, events)}
            className="h-3.5 w-3.5 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
            title="이 날짜 전체 선택"
          />
        </div>
        <div className="flex items-center gap-1 text-sm font-extrabold">
          {date.getDate()}
          <span className="text-xs font-bold">({WEEKDAY_KOR[dow]})</span>
        </div>
        {holidayName && (
          <span className="mt-0.5 inline-block text-[10px] font-bold leading-tight text-rose-500 break-keep">
            {holidayName}
          </span>
        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {sortedEvents.length === 0 ? (
          <p className="pt-0.5 text-xs text-slate-300">-</p>
        ) : (
          sortedEvents.map((ev) => {
            const isChecked = selectedEventIds.has(ev.id);
            const badgeLabel = ev.dept || "학습";
            const isGradeCommon = badgeLabel === "학년 공통";
            const targetBadgeText = isGradeCommon ? (ev.manager && ev.manager !== "전체" ? ev.manager : "전체") : null;

            return (
              <div key={ev.id} className="flex items-center gap-2 group">
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggleSelectEvent(ev.id)}
                  className="h-4 w-4 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
                  title="개별 일정 선택"
                />
                <button onClick={() => onOpenEvent(ev)} className="flex flex-1 items-center gap-2 rounded-lg px-1 py-0.5 text-left hover:bg-slate-100/85 transition min-w-0">
                  <Badge className={getTagStyle(badgeLabel)}>{badgeLabel}</Badge>
                  {targetBadgeText && (
                    <span className="rounded-md border border-violet-200 bg-violet-100/80 px-1.5 py-0.5 text-[11px] font-extrabold text-violet-800 shrink-0">
                      [{targetBadgeText}]
                    </span>
                  )}
                  <span className="pt-0.5 text-[13px] leading-snug text-slate-700 font-medium truncate">{ev.content}</span>
                  {!isGradeCommon && ev.manager && (
                    <span className="ml-auto shrink-0 pt-0.5 text-[13px] leading-snug text-slate-700 font-medium pl-2">
                      {ev.manager}
                    </span>
                  )}
                </button>
              </div>
            );
          })
        )}
      </div>
      <button onClick={() => onAddEvent(dateStr)} className="flex h-6 w-6 shrink-0 items-center justify-center self-start rounded-full text-slate-300 transition hover:bg-violet-100 hover:text-violet-500" title="이 날짜에 일정 추가">
        <PlusIcon size={16} />
      </button>
    </div>
  );
}

  const [adminAuthPwInput, setAdminAuthPwInput] = useState("");
  const [adminAuthError, setAdminAuthError] = useState("");

  const [gradeConfigs, setGradeConfigs] = useState(() => {
    try {
      const saved = localStorage.getItem("sp_grade_configs");
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    const init = {};
    INITIAL_GRADES.forEach(g => { init[g] = { classCount: 6, specialists: ["전담1", "전담2"] }; });
    return init;
  });

  const [classConfigModalOpen, setClassConfigModalOpen] = useState(false);
  const [editingConfigGrade, setEditingConfigGrade] = useState(selectedGrade);
  const [cfgClassCount, setCfgClassCount] = useState(6);
  const [cfgSpecialists, setCfgSpecialists] = useState(["전담1", "전담2"]);
  const [newSpecialistInput, setNewSpecialistInput] = useState("");

  const [selectedPwGrade, setSelectedPwGrade] = useState(selectedGrade);
  const [selectedPwClass, setSelectedPwClass] = useState("1반");
  const [customNewPwInput, setCustomNewPwInput] = useState("");
  const [customNewPwConfirm, setCustomNewPwConfirm] = useState("");
  const [editingMasterPwInput, setEditingMasterPwInput] = useState("");

  const activeClassList = useMemo(() => {
    const cfg = gradeConfigs[selectedGrade] || DEFAULT_CLASS_CONFIG;
    const classes = [];
    for (let i = 1; i <= cfg.classCount; i++) classes.push(`${i}반`);
    return [...classes, ...(cfg.specialists || [])];
  }, [selectedGrade, gradeConfigs]);

  const [classPasswords, setClassPasswords] = useState(() => {
    try { return JSON.parse(localStorage.getItem("sp_class_passwords")) || {}; } catch { return {}; }
  });

  const [targetSwitch, setTargetSwitch] = useState(null);
  const [switchPwInput, setSwitchPwInput] = useState("");
  const [switchError, setSwitchError] = useState("");
  const [isSettingNewPw, setIsSettingNewPw] = useState(false);
  const [newPwInput, setNewPwInput] = useState("");

  const currentClassKey = `${selectedGrade}_${selectedClass || '전체'}`;
  const currentClassPassword = selectedClass ? (classPasswords[`${selectedGrade}_${selectedClass}`] || "1234") : "1234";

  const handleGradeClick = (g) => {
    setSelectedGrade(g);
    setSelectedClass(null);
    localStorage.setItem("sp_last_grade", g);
    localStorage.removeItem("sp_last_class");
  };

  const promptSwitchClass = (g, c) => {
    if (g === selectedGrade && c === selectedClass) return;
    if (isAdminMode) {
      setSelectedGrade(g);
      setSelectedClass(c);
      localStorage.setItem("sp_last_grade", g);
      localStorage.setItem("sp_last_class", c);
      return;
    }
    const key = `${g}_${c}`;
    const registeredPw = classPasswords[key];
    setTargetSwitch({ grade: g, class: c });
    setSwitchPwInput("");
    setNewPwInput("");
    setSwitchError("");
    setIsSettingNewPw(!registeredPw);
  };

  const confirmSwitchClass = () => {
    if (!targetSwitch) return;
    const { grade, class: cls } = targetSwitch;
    const key = `${grade}_${cls}`;
    const registeredPw = classPasswords[key];

    if (!registeredPw) {
      if (!newPwInput.trim()) {
        setSwitchError("새로 사용할 비밀번호를 입력해주세요.");
        return;
      }
      const updated = { ...classPasswords, [key]: newPwInput.trim() };
      setClassPasswords(updated);
      localStorage.setItem("sp_class_passwords", JSON.stringify(updated));
      setSelectedGrade(grade);
      setSelectedClass(cls);
      localStorage.setItem("sp_last_grade", grade);
      localStorage.setItem("sp_last_class", cls);
      setTargetSwitch(null);
      alert(`${grade} ${cls} 비밀번호가 설정되고 전환되었습니다.`);
      return;
    }

    if (switchPwInput !== registeredPw && switchPwInput !== masterPassword) {
      setSwitchError("비밀번호가 일치하지 않습니다.");
      return;
    }

    setSelectedGrade(grade);
    setSelectedClass(cls);
    localStorage.setItem("sp_last_grade", grade);
    localStorage.setItem("sp_last_class", cls);
    setTargetSwitch(null);
  };

  const handleToggleAdminMode = () => {
    if (isAdminMode) {
      setIsAdminMode(false);
      alert("관리자 모드가 해제되었습니다.");
    } else {
      setAdminAuthPwInput("");
      setAdminAuthError("");
      setAdminAuthModalOpen(true);
    }
  };

  const confirmAdminAuth = () => {
    if (adminAuthPwInput === masterPassword) {
      setIsAdminMode(true);
      setAdminAuthModalOpen(false);
      alert("👑 관리자 모드로 전환되었습니다.");

      setAdminAuthError("마스터 비밀번호가 일치하지 않습니다.");

  };

  const [deletePwInput, setDeletePwInput] = useState("");

  const parseCsvLine = (text) => {
    const result = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (c === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = "";
      } else {
        cur += c;
      }
    }
    result.push(cur.trim());
    return result;
  };

  const parseGradeStr = (raw) => {
    if (!raw) return selectedGrade;
    const match = String(raw).match(/\d+/);
    if (match) return `${match[0]}학년`;
    return raw.includes("학년") ? raw : `${raw}학년`;
  };

  const parseClassStr = (raw) => {
    if (!raw) return { dept: "학년 공통", manager: "전체", category: "학년 공통" };
    const str = String(raw).trim();
    if (str === "전체" || str === "공통" || str === "학년 공통" || str === "") {
      return { dept: "학년 공통", manager: "전체", category: "학년 공통" };
    }

    if (!/\d/.test(str)) {
      return { dept: str, manager: "", category: "학습" };
    }

    const digits = str.replace(/[^\d]/g, '').split('').filter(Boolean);
    if (digits.length === 1) {
      return { dept: `${digits[0]}반`, manager: "", category: "학습" };
    } else if (digits.length > 1) {
      const uniqueDigits = Array.from(new Set(digits)).sort((a, b) => a - b);
      const classListFormatted = uniqueDigits.map(d => `${d}반`).join(", ");
      return { dept: "학년 공통", manager: classListFormatted, category: "학년 공통" };
    }

    return { dept: str, manager: "", category: "학습" };
  };

  const handleCsvFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setCsvFileName(file.name);
    setCsvError("");

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = event.target.result;
        
        if (text.includes("<?xml") || text.includes("<Workbook")) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, "text/xml");
          const rows = xmlDoc.getElementsByTagName("Row");
          const parsed = [];
          
          for (let i = 0; i < rows.length; i++) {
            const cells = rows[i].getElementsByTagName("Cell");
            const cols = [];
            for (let j = 0; j < cells.length; j++) {
              cols.push(cells[j].textContent ? cells[j].textContent.trim() : "");
            }
            if (cols.length === 0 || cols[0].includes("날짜") || cols[0].includes("YYYY")) continue;
            if (!cols[0] || !cols[3]) continue;

            const formattedGrade = parseGradeStr(cols[1]);
            const classInfo = parseClassStr(cols[2]);
            const eventContent = cols[3];
            const eventCategory = cols[4] || classInfo.category || "학습";
            const eventManager = cols[5] ? cols[5] : (classInfo.manager || "");
            const eventPw = cols[6] || "1234";

            parsed.push({
              id: Math.floor(Date.now() + Math.random() * 1000000 + i) % 2147483647,
              date: cols[0].replace(/[./]/g, '-'),
              grade: formattedGrade,
              dept: classInfo.dept,
              content: eventContent,
              category: eventCategory,
              manager: eventManager,
              password: eventPw
            });
          }

          if (parsed.length === 0) {
            setCsvError("일정 데이터를 파싱하지 못했습니다. 파일 내용을 확인해 주세요.");
          } else {
            setCsvParsedData(parsed);
          }
          return;
        }

        const lines = text.split(/\r\n|\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length <= 1) {
          setCsvError("업로드한 파일에 유효한 데이터 행이 존재하지 않습니다.");
          return;
        }

        const parsed = [];
        for (let i = 0; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          if (cols[0].includes("날짜") || cols[0].includes("YYYY")) continue;
          if (!cols[0] || !cols[3]) continue;

          const formattedGrade = parseGradeStr(cols[1]);
          const classInfo = parseClassStr(cols[2]);
          const eventContent = cols[3];
          const eventCategory = cols[4] || classInfo.category || "학습";
          const eventManager = cols[5] ? cols[5] : (classInfo.manager || "");
          const eventPw = cols[6] || "1234";

          parsed.push({
            id: Math.floor(Date.now() + Math.random() * 1000000 + i) % 2147483647,
            date: cols[0].replace(/[./]/g, '-'),
            grade: formattedGrade,
            dept: classInfo.dept,
            content: eventContent,
            category: eventCategory,
            manager: eventManager,
            password: eventPw
          });
        }

        if (parsed.length === 0) {
          setCsvError("일정 데이터를 파싱하지 못했습니다. CSV 형식(날짜, 학년, 학급, 내용)을 확인해 주세요.");
        } else {
          setCsvParsedData(parsed);
        }
      } catch (err) {
        setCsvError("파일 분석 중 오류가 발생했습니다: " + err.message);
      }
    };
    reader.readAsText(file, "UTF-8");
  };

            <td style="text-align: center;">${escapeToExcelCell(managerRaw)}</td>
          </tr>
      `;
    });

    if (gNotice || cNotice) {
      const combinedNotices = [
        gNotice ? `[학년 공통]\n${gNotice}` : "",
        cNotice ? `[학급/전담]\n${cNotice}` : ""
      ].filter(Boolean).join("\n\n");

      htmlTableContent += `
          <tr>
            <td colspan="2" style="text-align: center; font-weight: bold; background-color: #f9fafb;">공지 및 협의</td>
            <td colspan="2">${escapeToExcelCell(combinedNotices)}</td>
          </tr>
      `;
    }

    htmlTableContent += `</table></body></html>`;

    const blob = new Blob(["\uFEFF" + htmlTableContent], { type: "application/vnd.ms-excel;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", `${selectedGrade}_${selectedClass || '공통'}_학급행사관리.xls`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const goPrev = () => (tab === "month" ? setViewDate((d) => addMonths(d, -1)) : setWeekAnchor((d) => addDays(d, -7)));
  const goNext = () => (tab === "month" ? setViewDate((d) => addMonths(d, 1)) : setWeekAnchor((d) => addDays(d, 7)));
  const goToday = () => {
    if (tab === "month") setViewDate(new Date()); else setWeekAnchor(new Date());
  };

  const generateCycles = (baseDateStr, repeatType, endDateStr) => {
    if (repeatType === "none" || !baseDateStr || !endDateStr) return [{ date: baseDateStr }];
    const intervalDays = repeatType === "weekly" ? 7 : 14;
    const start = new Date(baseDateStr);
    const end = new Date(endDateStr);
    const cycles = [];
    let cur = new Date(start);
    while (cur <= end) {
      cycles.push({ date: ymd(cur) });
      cur = addDays(cur, intervalDays);
      if (cycles.length > 52) break;
    }
    return cycles.length > 0 ? cycles : [{ date: baseDateStr }];
  };

  const openAddEvent = (dateStr) => {
    const baseDate = dateStr || ymd(today);
    const defaultEnd = ymd(addMonths(new Date(baseDate), 1));
    const initialCycles = [{ date: baseDate }];
    const autoCategory = selectedClass ? "학습" : "학년 공통";

    setForm({
      ...emptyForm,
      targetGrade: selectedGrade,
      category: autoCategory,
      schedules: [defaultScheduleRow(baseDate)],
      repeatEndDate: defaultEnd,
      repeatCycles: initialCycles
    });
    setEventModal({ mode: "add" });
  };

  const openEditEvent = (ev) => {
    const cat = ev.dept || "학습";
    const isGradeCommon = cat === "학년 공통";
    const isCustomTarget = isGradeCommon && ev.manager && ev.manager !== "전체";

    setForm({
      targetGrade: ev.grade || selectedGrade,
      category: cat,
      content: ev.content,
      manager: !isGradeCommon ? (ev.manager || "") : "",
      password: ev.password,
      schedules: [{
        date: ev.date,
        targetType: isCustomTarget ? "custom" : "all",
        selectedTargets: isCustomTarget ? ev.manager.split(", ") : [...activeClassList]
      }],
      repeatType: "none",
      repeatEndDate: ev.date,
      repeatCycles: [{ date: ev.date }]
    });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "edit", data: ev });
  };

  const addScheduleRow = () => {
    const lastRow = form.schedules[form.schedules.length - 1];
    const newDate = lastRow ? lastRow.date : ymd(today);
    setForm(prev => ({ ...prev, schedules: [...prev.schedules, defaultScheduleRow(newDate)] }));
  };

  const removeScheduleRow = (index) => {
    if (form.schedules.length <= 1) return;
    setForm(prev => ({ ...prev, schedules: form.schedules.filter((_, idx) => idx !== index) }));
  };

  const updateScheduleRow = (index, field, value) => {
    setForm(prev => {
      const nextSchedules = [...prev.schedules];
      nextSchedules[index] = { ...nextSchedules[index], [field]: value };
      let nextCycles = prev.repeatCycles;
      if (index === 0 && field === "date" && prev.repeatType !== "none") {
        nextCycles = generateCycles(value, prev.repeatType, prev.repeatEndDate);
      }
      return { ...prev, schedules: nextSchedules, repeatCycles: nextCycles };
    });
  };

  const handleRepeatTypeChange = (newType) => {
    const baseDate = form.schedules[0]?.date || ymd(today);
    const cycles = generateCycles(baseDate, newType, form.repeatEndDate);
    setForm(prev => ({ ...prev, repeatType: newType, repeatCycles: cycles }));
  };

  const handleRepeatEndDateChange = (newEndDate) => {
    const baseDate = form.schedules[0]?.date || ymd(today);
    const cycles = generateCycles(baseDate, form.repeatType, newEndDate);
    setForm(prev => ({ ...prev, repeatEndDate: newEndDate, repeatCycles: cycles }));
  };

  const removeCycleItem = (cycleIdx) => {
    if (form.repeatCycles.length <= 1) return;
    setForm(prev => ({ ...prev, repeatCycles: form.repeatCycles.filter((_, idx) => idx !== cycleIdx) }));
  };

  const addManualCycle = () => {
    const lastCycle = form.repeatCycles[form.repeatCycles.length - 1];
    const nextDate = lastCycle ? ymd(addDays(new Date(lastCycle.date), 7)) : ymd(today);
    setForm(prev => ({ ...prev, repeatCycles: [...prev.repeatCycles, { date: nextDate }] }));
  };

  const saveEvent = async () => {
    if (!form.content.trim()) return;
    const targetGrade = isAdminMode ? form.targetGrade : selectedGrade;
    const isGradeCommon = form.category === "학년 공통";
    const defaultTargetDept = selectedClass || (activeClassList[0] || "1반");
    const eventPassword = form.password.trim() || currentClassPassword;

    if (eventModal.mode === "add") {
      const newEvents = [];
      const baseRowDate = new Date(form.schedules[0].date);

      for (const cycle of form.repeatCycles) {
        const cycleDate = new Date(cycle.date);
        const dayDiff = Math.round((cycleDate - baseRowDate) / (1000 * 60 * 60 * 24));

        for (const row of form.schedules) {
          const rowDate = new Date(row.date);
          const targetDateObj = addDays(rowDate, dayDiff);
          const targetDateStr = ymd(targetDateObj);

          let finalManager = form.manager;
          if (isGradeCommon) {
            finalManager = row.targetType === "all" ? "전체" : row.selectedTargets.join(", ");
          }

          newEvents.push({
            id: Math.floor(Date.now() + Math.random() * 1000000) % 2147483647,
            date: targetDateStr,
            grade: targetGrade,
            dept: isGradeCommon ? "학년 공통" : defaultTargetDept,
            content: form.content,
            manager: finalManager,
            password: eventPassword
          });
        }
      }

      if (supabase) {
        await supabase.from('events').insert(newEvents);
      }
      setEvents(prev => [...prev, ...newEvents]);
      setEventModal(null);
      alert(`총 ${newEvents.length}건의 일정이 등록되었습니다.`);
    } else {
      if (!isAdminMode && pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword && pwCheckInput !== masterPassword) {
        setPwCheckError("비밀번호가 일치하지 않습니다.");
        return;
      }

      const row = form.schedules[0];
      let finalManager = form.manager;
      if (isGradeCommon) {
        finalManager = row.targetType === "all" ? "전체" : row.selectedTargets.join(", ");
      }

      const updatePayload = {
        date: row.date,
        grade: targetGrade,
        dept: isGradeCommon ? "학년 공통" : (eventModal.data.dept || defaultTargetDept),
        content: form.content,
        manager: finalManager
      };

      if (supabase) {
        await supabase.from('events').update(updatePayload).eq('id', eventModal.data.id);
      }
      setEvents(prev => prev.map(e => e.id === eventModal.data.id ? { ...e, ...updatePayload } : e));
      setEventModal(null);
      alert("일정이 수정되었습니다.");
    }
  };

  const deleteEvent = async () => {
    if (!isAdminMode && pwCheckInput !== eventModal.data.password && pwCheckInput !== currentClassPassword && pwCheckInput !== masterPassword) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");
      return;
    }
    if (supabase) {
      await supabase.from('events').delete().eq('id', eventModal.data.id);
    }
    setEvents(prev => prev.filter(e => e.id !== eventModal.data.id));
    setEventModal(null);
  };

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-32 sm:p-6 sm:pb-36">
      <div className="mx-auto max-w-3xl">
        
        {isAdminMode && (
          <div className="mb-4 flex items-center justify-between rounded-2xl bg-amber-500 px-4 py-2.5 text-white shadow-lg shadow-amber-200">
            <div className="flex items-center gap-2 text-xs font-bold truncate">
              <span className="rounded-lg bg-amber-700 px-2 py-0.5 shrink-0">MASTER ADMIN ON</span>
              <span className="truncate font-medium">관리자 모드 활성화됨: 모든 학년/학급 일정을 비밀번호 없이 관리할 수 있습니다.</span>
            </div>
            <button onClick={handleToggleAdminMode} className="ml-2 shrink-0 rounded-lg bg-amber-700 px-2.5 py-1 text-xs font-bold hover:bg-amber-800 transition">종료</button>
          </div>
        )}

        {copiedEvent && (
          <div className="mb-4 flex items-center justify-between rounded-xl bg-violet-600 px-4 py-2.5 text-white shadow-lg shadow-violet-200">
            <div className="flex items-center gap-2 text-xs truncate">
              <span className="rounded bg-violet-800 px-1.5 py-0.5 font-bold shrink-0">복사됨</span>
              <span className="truncate font-medium">"{copiedEvent.content}" (원하는 날짜의 '+' 버튼을 눌러 붙여넣기하세요)</span>
            </div>
            <button onClick={() => setCopiedEvent(null)} className="ml-2 shrink-0 rounded-lg bg-violet-700 px-2 py-0.5 text-xs hover:bg-violet-800">해제</button>
          </div>
        )}

        {/* 메인 헤더 패널 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-3">
            <div className="min-w-0 flex-1">
              <h1 className="text-xl font-extrabold text-slate-900 sm:text-2xl whitespace-nowrap overflow-hidden text-ellipsis mb-1">
                [{selectedGrade} {selectedClass ? selectedClass : "공통"}] 학급 및 전담 행사 관리 플래너
              </h1>
              <p className="text-xs text-slate-400">
                {selectedClass ? "학급 전용 일정 페이지입니다." : "학년 공통 뷰입니다. 특정 학급 버튼을 눌러 개별 반으로 이동하세요."}
              </p>
            </div>

            {todayPosition === "header" && (
              <div className="shrink-0 flex flex-col items-start md:items-end justify-center rounded-xl bg-gradient-to-br from-violet-50 to-indigo-50/70 border border-violet-100 p-2.5 min-w-[200px] shadow-2xs">
                <div className="flex items-center gap-1.5 text-xs font-black text-violet-700 mb-1">
                  <span>📢</span>
                  <span>오늘의 행사 ({today.getMonth() + 1}/{today.getDate()} {WEEKDAY_KOR[today.getDay()]})</span>
                </div>
                {todayEvents.length === 0 ? (
                  <span className="text-[11px] text-slate-400 font-medium">등록된 행사 없음</span>
                ) : (
                  <div className="flex flex-wrap gap-1 max-w-[260px] justify-start md:justify-end">
                    {todayEvents.slice(0, 3).map((ev, i) => (
                      <span key={i} className="rounded bg-white/90 border border-violet-200 px-1.5 py-0.5 text-[11px] font-bold text-slate-700 truncate max-w-[220px]">
                        {ev.content}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="space-y-3 border-t border-slate-100 pt-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 mr-1.5">학년:</span>
                {gradesList.map(g => (
                  <button
                    key={g}
                    onClick={() => handleGradeClick(g)}
                    className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedGrade === g ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                  >
                    {g}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-1.5 ml-auto">
                <button
                  onClick={handleToggleAdminMode}
                  className={`flex items-center gap-1 shrink-0 rounded-lg px-2.5 py-1.5 text-xs font-bold transition shadow-2xs ${isAdminMode ? "bg-amber-500 text-white" : "border border-amber-300 bg-amber-50 text-amber-800"}`}
                >
                  <ShieldAlertIcon size={13} /> {isAdminMode ? "관리자 켜짐" : "관리자 모드"}
                </button>
                <button
                  onClick={openClassConfigModal}
                  className="flex items-center gap-1 shrink-0 rounded-lg border border-violet-200 bg-white px-2.5 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-50 shadow-2xs"
                >
                  <SettingsIcon size={13} /> 학급/비번 설정
                </button>
                <button
                  onClick={() => { setSelectedHolidayDate(ymd(new Date())); setHolidayModalOpen(true); }}
                  className="flex items-center gap-1 shrink-0 rounded-lg border border-rose-200 bg-white px-2.5 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 shadow-2xs"
                >
                  <span>🏖️</span> 휴일 관리
                </button>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
              <span className="text-xs font-bold text-slate-500 mr-1.5">학급/전담:</span>
              {activeClassList.map(c => (
                <button
                  key={c}
                  onClick={() => promptSwitchClass(selectedGrade, c)}
                  className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedClass === c ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                >
                  {c}
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* 탭 & 출력/저장 & 날짜 이동 바 */}
        <div className="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white p-2 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-wrap items-center gap-2">
            <div className="flex gap-1 rounded-xl bg-slate-100 p-1">
              <button onClick={() => setTab("month")} className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tab === "month" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500"}`}>월별 일정</button>
              <button onClick={() => setTab("week")} className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tab === "week" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500"}`}>주간 행사 계획</button>
            </div>
            <button onClick={handlePrint} className="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50 px-3.5 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-100 shadow-xs">
              <PrinterIcon size={14} /> 출력/저장
            </button>
          </div>

          <div className="flex items-center gap-2">
            <button onClick={goPrev} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100"><ChevronLeft size={18} /></button>
            <span className="min-w-[90px] text-center text-sm font-bold text-slate-700">{tab === "month" ? monthLabel : weekLabel}</span>
            <button onClick={goNext} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100"><ChevronRight size={18} /></button>
            <button onClick={goToday} className="ml-1 rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-500">오늘</button>
          </div>
        </div>

        {/* 오늘의 행사 위치가 'notice'일 때 */}
        {todayPosition === "notice" && (
          <div className="mb-4 rounded-2xl bg-gradient-to-r from-violet-500 to-indigo-600 p-4 text-white shadow-sm ring-1 ring-violet-200">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5 text-xs font-extrabold">
                <span>📢</span>
                <span>오늘의 행사 ({today.getMonth() + 1}/{today.getDate()} {WEEKDAY_KOR[today.getDay()]})</span>
              </div>
            </div>
            {todayEvents.length === 0 ? (
              <p className="text-xs text-violet-100 py-1">오늘 예정된 행사가 없습니다.</p>
            ) : (
              <div className="flex flex-wrap gap-2 pt-1">
                {todayEvents.map((ev, i) => (
                  <div key={i} className="flex items-center gap-1.5 rounded-xl bg-white/95 px-3 py-1.5 text-slate-800 text-xs font-bold shadow-xs">
                    <span className="rounded bg-violet-100 px-1.5 py-0.5 text-[10px] text-violet-700 font-extrabold">{ev.dept}</span>
                    <span>{ev.content}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* 공지 및 협의사항 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="mb-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-xs font-extrabold text-slate-800">공지 및 협의사항</span>
              <span className="text-[11px] text-slate-400 font-medium">({selectedGrade} {selectedClass ? selectedClass : '공통'})</span>
            </div>
            <button onClick={openNoticeEditModal} className="rounded-lg bg-violet-100 px-3 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-200 transition shadow-2xs">글쓰기/수정</button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div className="rounded-xl border border-indigo-100 bg-indigo-50/40 p-3 space-y-1">
              <span className="rounded bg-indigo-600 px-1.5 py-0.5 text-[10px] font-bold text-white">학년 공통 공지</span>
              <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed min-h-[40px] pt-1">
                {activeGradeNotice ? activeGradeNotice : <span className="text-slate-300">등록된 학년 공통 공지가 없습니다.</span>}
              </p>
            </div>
            <div className="rounded-xl border border-violet-100 bg-violet-50/40 p-3 space-y-1">
              <span className="rounded bg-violet-600 px-1.5 py-0.5 text-[10px] font-bold text-white">[{selectedClass ? selectedClass : '학급'}] 알림장 및 전달사항</span>
              <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed min-h-[40px] pt-1">
                {activeClassNotice ? activeClassNotice : <span className="text-slate-300">등록된 학급 전달사항이 없습니다.</span>}
              </p>
            </div>
          </div>
        </div>

        {/* 버튼 바 */}
        <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div className="ml-auto flex items-center gap-2">
            {selectedEventIds.size > 0 && (
              <button onClick={openDeleteModal} className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-bold text-rose-600 shadow-sm hover:bg-rose-100 transition animate-pulse">
                <Trash2Icon size={14} /> 선택 삭제 ({selectedEventIds.size})
              </button>
            )}
            <button onClick={() => { setCsvParsedData([]); setCsvFileName(""); setCsvError(""); setCsvModalOpen(true); }} className="flex items-center gap-1.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3.5 py-2 text-xs font-bold text-indigo-700 hover:bg-indigo-100 shadow-2xs">
              <UploadCloudIcon size={15} /> <span>CSV 일괄 업로드</span>
            </button>
            <button onClick={() => openAddEvent(tab === "month" ? ymd(today) : ymd(weekDates[0]))} className="flex items-center gap-1 rounded-xl bg-violet-600 px-3.5 py-2 text-xs font-bold text-white shadow-sm hover:bg-violet-700">
              <PlusIcon size={14} /> 일정 추가
            </button>
          </div>
        </div>

        {/* 캘린더 리스트 본문 */}
        <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 mb-8">
          {(tab === "month" ? monthDays : weekDates).map((d, idx) => {
            const dStr = ymd(d);
            const dayEvents = eventsByDate[dStr] || [];
            const evIds = dayEvents.map(e => e.id);
            const isDateSelected = evIds.length > 0 && evIds.every(id => selectedEventIds.has(id));

            return (
              <DateRow
                key={dStr}
                date={d}
                today={today}
                events={dayEvents}
                isLast={idx === (tab === "month" ? monthDays : weekDates).length - 1}
                onAddEvent={openAddEvent}
                onOpenEvent={openEditEvent}
                customHolidays={customHolidays}
                selectedEventIds={selectedEventIds}
                onToggleSelectEvent={handleToggleSelectEvent}
                onToggleSelectDate={handleToggleSelectDate}
                isDateSelected={isDateSelected}
              />
            );
          })}
        </div>

        {/* CSV 일괄 업로드 모달 */}
        {csvModalOpen && (
          <Modal title="일정 CSV 파일 일괄 업로드" onClose={() => setCsvModalOpen(false)} wide>
            <div className="space-y-4">
              <div className="rounded-2xl border border-indigo-100 bg-indigo-50/60 p-3.5 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold text-indigo-950 block">템플릿 다운로드 및 안내</span>
                  <button type="button" onClick={downloadCsvTemplate} className="rounded-xl bg-white border border-indigo-300 px-3 py-1.5 text-xs font-extrabold text-indigo-700">📄 엑셀 양식 다운로드</button>
                </div>
              </div>
              <div>
                <FieldLabel>파일 선택 (.xls 또는 .csv)</FieldLabel>
                <input type="file" accept=".csv, .txt, .xls, .xml" onChange={handleCsvFileUpload} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100"/>
              </div>
              {csvParsedData.length > 0 && (
                <p className="text-xs font-bold text-emerald-600">✓ 총 {csvParsedData.length}건 인식 완료</p>
              )}
              <div className="flex items-center gap-2 pt-2 border-t">
                <button type="button" onClick={() => setCsvModalOpen(false)} className="flex-1 rounded-xl border py-2.5 text-sm font-bold text-slate-500">취소</button>
                <button type="button" disabled={csvParsedData.length === 0} onClick={handleConfirmBatchUpload} className="flex-1 rounded-xl bg-indigo-600 py-2.5 text-sm font-bold text-white">일괄 등록하기</button>
              </div>
            </div>
          </Modal>
        )}

        {/* 공지 작성 모달 */}
        {noticeModalOpen && (
          <Modal title="공지 및 협의사항 작성" onClose={() => setNoticeModalOpen(false)} wide>
            <div className="space-y-4">
              <select value={noticeScope} onChange={(e) => handleScopeChange(e.target.value)} className={inputCls}>
                <option value="grade">📢 [{selectedGrade}] 학년 공통 공지</option>
                <option value="class">🏫 [{selectedGrade} {selectedClass || '학급'}] 알림장</option>
              </select>
              <textarea value={modalNoticeText} onChange={(e) => setModalNoticeText(e.target.value)} rows={4} className={inputCls} placeholder="내용을 입력하세요."/>
              <div className="flex items-center gap-2 pt-2 border-t">
                <button type="button" onClick={handleDeleteNoticeModal} className="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-bold text-rose-600">삭제</button>
                <button type="button" onClick={() => setNoticeModalOpen(false)} className="flex-1 rounded-xl border py-2 text-sm font-bold text-slate-500">취소</button>
                <button type="button" onClick={handleSaveNoticeModal} className="flex-1 rounded-xl bg-violet-600 py-2 text-sm font-bold text-white">저장</button>
              </div>
            </div>
          </Modal>
        )}

        {/* 설정 모달 */}
        {classConfigModalOpen && (
          <Modal title="학급 구성 및 환경 설정" onClose={() => setClassConfigModalOpen(false)} wide>
            <div className="space-y-4 max-h-[75vh] overflow-y-auto pr-1">
              <div className="rounded-xl border bg-slate-50 p-3 space-y-2">
                <FieldLabel>📌 오늘의 행사 표시 위치</FieldLabel>
                <div className="flex gap-4 text-xs font-bold">
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="pos" checked={todayPosition === "header"} onChange={() => handleUpdateTodayPosition("header")} /> 상단 헤더 우측
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="pos" checked={todayPosition === "notice"} onChange={() => handleUpdateTodayPosition("notice")} /> 공지사항 상단 패널
                  </label>
                </div>
              </div>
              <button type="button" onClick={() => setClassConfigModalOpen(false)} className="w-full rounded-xl border py-2.5 text-sm font-bold text-slate-600">닫기</button>
            </div>
          </Modal>
        )}

        {/* 관리자 모드 인증 모달 */}
        {adminAuthModalOpen && (
          <Modal title="마스터 관리자 인증" onClose={() => setAdminAuthModalOpen(false)}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input type="password" autoFocus value={adminAuthPwInput} onChange={(e) => setAdminAuthPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && confirmAdminAuth()} className={inputCls} placeholder="비밀번호 입력"/>
            {adminAuthError && <p className="mt-2 text-xs font-semibold text-rose-500">{adminAuthError}</p>}
            <div className="mt-4 flex items-center gap-2">
              <button onClick={() => setAdminAuthModalOpen(false)} className="flex-1 rounded-xl border py-2.5 text-sm font-bold text-slate-500">취소</button>
              <button onClick={confirmAdminAuth} className="flex-1 rounded-xl bg-amber-500 py-2.5 text-sm font-bold text-white">인증</button>
            </div>
          </Modal>
        )}

        {/* 일정 추가/수정 모달 */}
        {eventModal && (
          <Modal title={eventModal.mode === "add" ? "일정 일괄 추가" : "일정 수정"} onClose={() => setEventModal(null)} wide>
            <div className="space-y-4 max-h-[75vh] overflow-y-auto pr-1">
              <div>
                <FieldLabel>행사 내용</FieldLabel>
                <input type="text" value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} placeholder="예) 현장체험학습" className={inputCls}/>
              </div>
              <button onClick={saveEvent} className="w-full rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white shadow-md">저장하기</button>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
