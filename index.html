function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const startOfWeekMon = (d) => { const r = new Date(d); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(r, diff); };

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function sortEvents(events) {
  const catOrder = EVENT_CATEGORIES;
  return [...events].sort((a, b) => {
    const catA = a.dept || "학습";
    const catB = b.dept || "학습";
    const idxA = catOrder.indexOf(catA);
    const idxB = catOrder.indexOf(catB);
    if (idxA !== idxB) return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
    return (a.content || "").localeCompare(b.content || "", "ko");
  });
}

  const isToday = sameDay(date, today);
  const holidayName = (customHolidays && customHolidays[dateStr]) || null;
  const isHoliday = dow === 0 || !!holidayName;

  const rowBg = isToday ? "bg-emerald-50/70" : isHoliday ? "bg-rose-50/40" : dow === 6 ? "bg-blue-50/30" : "bg-white";
  const dateColor = isToday ? "text-emerald-600" : isHoliday ? "text-rose-500 font-black" : dow === 6 ? "text-blue-400" : "text-slate-500";
  const sortedEvents = sortEvents(events);

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 min-h-[52px] ${rowBg} ${isLast ? "border-b-0" : ""}`}>
      <div className={`flex w-16 shrink-0 flex-col items-start pt-0.5 sm:w-20 ${dateColor}`}>
        <div className="flex items-center gap-1.5 mb-1">
          <input
            type="checkbox"
            checked={isDateSelected}
            onChange={() => onToggleSelectDate(dateStr, events)}
            className="h-3.5 w-3.5 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
            title="이 날짜 전체 선택"
          />
        </div>
        <div className="flex items-center gap-1 text-sm font-extrabold">
          {date.getDate()}
          <span className="text-xs font-bold">({WEEKDAY_KOR[dow]})</span>
        </div>
        {holidayName && (
          <span className="mt-0.5 inline-block text-[10px] font-bold leading-tight text-rose-500 break-keep">
            {holidayName}
          </span>
        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {sortedEvents.length === 0 ? (
          <p className="pt-0.5 text-xs text-slate-300">-</p>
        ) : (
          sortedEvents.map((ev) => {
            const isChecked = selectedEventIds.has(ev.id);
            const badgeLabel = ev.dept || "학습";
            const isGradeCommon = badgeLabel === "학년 공통";
            const targetBadgeText = isGradeCommon ? (ev.manager && ev.manager !== "전체" ? ev.manager : "전체") : null;

            return (
              <div key={ev.id} className="flex items-center gap-2 group">
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggleSelectEvent(ev.id)}
                  className="h-4 w-4 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
                  title="개별 일정 선택"
                />
                <button onClick={() => onOpenEvent(ev)} className="flex flex-1 items-center gap-2 rounded-lg px-1 py-0.5 text-left hover:bg-slate-100/85 transition min-w-0">
                  <Badge className={getTagStyle(badgeLabel)}>{badgeLabel}</Badge>
                  {targetBadgeText && (
                    <span className="rounded-md border border-violet-200 bg-violet-100/80 px-1.5 py-0.5 text-[11px] font-extrabold text-violet-800 shrink-0">
                      [{targetBadgeText}]
                    </span>
                  )}
                  <span className="pt-0.5 text-[13px] leading-snug text-slate-700 font-medium truncate">{ev.content}</span>
                  {!isGradeCommon && ev.manager && (
                    <span className="ml-auto shrink-0 pt-0.5 text-[13px] leading-snug text-slate-700 font-medium pl-2">
                      {ev.manager}
                    </span>
                  )}
                </button>
              </div>
            );
          })
        )}
      </div>
      <button onClick={() => onAddEvent(dateStr)} className="flex h-6 w-6 shrink-0 items-center justify-center self-start rounded-full text-slate-300 transition hover:bg-violet-100 hover:text-violet-500" title="이 날짜에 일정 추가">
        <PlusIcon size={16} />
      </button>
    </div>
  );
}

function App() {
  const today = new Date();
  const [tab, setTab] = useState("month");
  const [viewDate, setViewDate] = useState(new Date());
  const [weekAnchor, setWeekAnchor] = useState(new Date());

  // 지원청 및 학교 선택 상태
  const [currentOffice, setCurrentOffice] = useState(() => localStorage.getItem("sp_office") || "서부교육지원청");
  const [currentSchool, setCurrentSchool] = useState(() => localStorage.getItem("sp_school") || "인천경연초등학교");
  const [schoolModalOpen, setSchoolModalOpen] = useState(false);
  const [tempOffice, setTempOffice] = useState(currentOffice);
  const [tempSchool, setTempSchool] = useState(currentSchool);
  const [schoolSearchQuery, setSchoolSearchQuery] = useState("");

  const [gradesList, setGradesList] = useState(() => {
    try {
      const saved = localStorage.getItem(`sp_grade_list_${currentSchool}`);
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return INITIAL_GRADES;
  });

  const [selectedGrade, setSelectedGrade] = useState(() => localStorage.getItem(`sp_last_grade_${currentSchool}`) || (gradesList[0] || "1학년"));
  const [selectedClass, setSelectedClass] = useState(() => localStorage.getItem(`sp_last_class_${currentSchool}`) || null);

  const [todayPosition, setTodayPosition] = useState(() => localStorage.getItem("sp_today_pos") || "header");

  const [isAdminMode, setIsAdminMode] = useState(false);
  const [masterPassword, setMasterPassword] = useState(() => localStorage.getItem(`sp_master_pw_${currentSchool}`) || "admin1234");
  const [adminAuthModalOpen, setAdminAuthModalOpen] = useState(false);
  const [adminAuthPwInput, setAdminAuthPwInput] = useState("");
  const [adminAuthError, setAdminAuthError] = useState("");

  const [gradeConfigs, setGradeConfigs] = useState(() => {
    try {
      const saved = localStorage.getItem(`sp_grade_configs_${currentSchool}`);
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    const init = {};
    INITIAL_GRADES.forEach(g => { init[g] = { classCount: 6, specialists: ["전담1", "전담2"] }; });
    return init;
  });

  const [classConfigModalOpen, setClassConfigModalOpen] = useState(false);
  const [editingConfigGrade, setEditingConfigGrade] = useState(selectedGrade);
  const [cfgClassCount, setCfgClassCount] = useState(6);
  const [cfgSpecialists, setCfgSpecialists] = useState(["전담1", "전담2"]);
  const [newSpecialistInput, setNewSpecialistInput] = useState("");
  const [newGradeInput, setNewGradeInput] = useState("");

  const [selectedPwGrade, setSelectedPwGrade] = useState(selectedGrade);
  const [selectedPwClass, setSelectedPwClass] = useState("1반");
  const [customNewPwInput, setCustomNewPwInput] = useState("");
  const [customNewPwConfirm, setCustomNewPwConfirm] = useState("");
  const [editingMasterPwInput, setEditingMasterPwInput] = useState("");

  const activeClassList = useMemo(() => {
    const cfg = gradeConfigs[selectedGrade] || DEFAULT_CLASS_CONFIG;
    const classes = [];
    for (let i = 1; i <= cfg.classCount; i++) classes.push(`${i}반`);
    return [...classes, ...(cfg.specialists || [])];
  }, [selectedGrade, gradeConfigs]);

  const [classPasswords, setClassPasswords] = useState(() => {
    try { return JSON.parse(localStorage.getItem(`sp_class_pw_${currentSchool}`)) || {}; } catch { return {}; }
  });

  const [targetSwitch, setTargetSwitch] = useState(null);
  const [switchPwInput, setSwitchPwInput] = useState("");
  const [switchError, setSwitchError] = useState("");
  const [isSettingNewPw, setIsSettingNewPw] = useState(false);
  const [newPwInput, setNewPwInput] = useState("");

  const currentClassKey = `${selectedGrade}_${selectedClass || '전체'}`;
  const currentClassPassword = selectedClass ? (classPasswords[`${selectedGrade}_${selectedClass}`] || "1234") : "1234";

  const handleGradeClick = (g) => {
    setSelectedGrade(g);
    setSelectedClass(null);
    localStorage.setItem(`sp_last_grade_${currentSchool}`, g);
    localStorage.removeItem(`sp_last_class_${currentSchool}`);
  };

  const promptSwitchClass = (g, c) => {
    if (g === selectedGrade && c === selectedClass) return;
    if (isAdminMode) {
      setSelectedGrade(g);
      setSelectedClass(c);
      localStorage.setItem(`sp_last_grade_${currentSchool}`, g);
      localStorage.setItem(`sp_last_class_${currentSchool}`, c);
      return;
    }
    const key = `${g}_${c}`;
    const registeredPw = classPasswords[key];
    setTargetSwitch({ grade: g, class: c });
    setSwitchPwInput("");
    setNewPwInput("");
    setSwitchError("");
    setIsSettingNewPw(!registeredPw);
  };

  const confirmSwitchClass = () => {
    if (!targetSwitch) return;
    const { grade, class: cls } = targetSwitch;
    const key = `${grade}_${cls}`;
    const registeredPw = classPasswords[key];

    if (!registeredPw) {
      if (!newPwInput.trim()) {
        setSwitchError("새로 사용할 비밀번호를 입력해주세요.");
        return;
      }
      const updated = { ...classPasswords, [key]: newPwInput.trim() };
      setClassPasswords(updated);
      localStorage.setItem(`sp_class_pw_${currentSchool}`, JSON.stringify(updated));
      setSelectedGrade(grade);
      setSelectedClass(cls);
      localStorage.setItem(`sp_last_grade_${currentSchool}`, grade);
      localStorage.setItem(`sp_last_class_${currentSchool}`, cls);
      setTargetSwitch(null);
      alert(`${grade} ${cls} 비밀번호가 설정되고 전환되었습니다.`);
      return;
    }

    if (switchPwInput !== registeredPw && switchPwInput !== masterPassword) {
      setSwitchError("비밀번호가 일치하지 않습니다.");
      return;
    }

    setSelectedGrade(grade);
    setSelectedClass(cls);
    localStorage.setItem(`sp_last_grade_${currentSchool}`, grade);
    localStorage.setItem(`sp_last_class_${currentSchool}`, cls);
    setTargetSwitch(null);
  };

  const [customHolidays, setCustomHolidays] = useState(() => {
    try { return JSON.parse(localStorage.getItem(`sp_holidays_${currentSchool}`)) || {}; } catch { return {}; }
  });
  const [holidayModalOpen, setHolidayModalOpen] = useState(false);
  const [holidayCalendarDate, setHolidayCalendarDate] = useState(new Date());
  const [selectedHolidayDate, setSelectedHolidayDate] = useState(ymd(new Date()));
  const [holidayNameInput, setHolidayNameInput] = useState("재량휴업일");

  const [notices, setNotices] = useState(() => {
    try { return JSON.parse(localStorage.getItem(`sp_notices_${currentSchool}`)) || {}; } catch { return {}; }
  });

  const getPeriodKey = (scopeType) => {
    const period = tab === "month" ? `${viewDate.getFullYear()}-${pad2(viewDate.getMonth() + 1)}` : ymd(startOfWeekMon(weekAnchor));
    if (scopeType === "grade") {
      return `${currentSchool}_${selectedGrade}_COMMON_${period}`;
    } else {
      const cls = selectedClass || '1반';
      return `${currentSchool}_${selectedGrade}_${cls}_${period}`;
    }
  };

  const gradeNoticeKey = getPeriodKey("grade");
  const classNoticeKey = getPeriodKey("class");

  const [noticeModalOpen, setNoticeModalOpen] = useState(false);
  const [noticeScope, setNoticeScope] = useState("grade");
  const [modalNoticeText, setModalNoticeText] = useState("");

  const openNoticeEditModal = () => {
    const currentScope = selectedClass ? "class" : "grade";
    setNoticeScope(currentScope);
    const initialText = notices[getPeriodKey(currentScope)] || "";
    setModalNoticeText(initialText);
    setNoticeModalOpen(true);
  };

  const supabase = useMemo(() => {
    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      try { return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (err) { return null; }
    }
    return null;
  }, []);

  const [events, setEvents] = useState([]);

  // Supabase 실시간 동기화 (학교별 격리)
  const fetchAllData = useCallback(async () => {
    if (!supabase) return;
    try {
      const { data: dbEvents } = await supabase.from('events').select('*').eq('school_name', currentSchool);
      if (dbEvents) setEvents(dbEvents);
    } catch(e) {}
    try {
      const { data: dbAdmin } = await supabase.from('admin_status').select('*');
      if (dbAdmin) {
        dbAdmin.forEach(item => {
          if (item.week_key === `holidays_${currentSchool}`) {
            setCustomHolidays(item.data || {});
            localStorage.setItem(`sp_holidays_${currentSchool}`, JSON.stringify(item.data || {}));
          } else if (item.week_key === `notices_${currentSchool}`) {
            setNotices(item.data || {});
            localStorage.setItem(`sp_notices_${currentSchool}`, JSON.stringify(item.data || {}));
          } else if (item.week_key === `configs_${currentSchool}`) {
            setGradeConfigs(item.data || {});
            localStorage.setItem(`sp_grade_configs_${currentSchool}`, JSON.stringify(item.data || {}));
          } else if (item.week_key === `grades_${currentSchool}`) {
            if (Array.isArray(item.data)) {
              setGradesList(item.data);
              localStorage.setItem(`sp_grade_list_${currentSchool}`, JSON.stringify(item.data));
            }
          }
        });
      }
    } catch(e) {}
  }, [supabase, currentSchool]);

  useEffect(() => {
    fetchAllData();
    if (!supabase) return;
    const timer = setInterval(fetchAllData, 5000);
    return () => clearInterval(timer);
  }, [supabase, fetchAllData]);

  // 학교 변경 적용
  const handleApplySchoolChange = (newOffice, newSch) => {
    setCurrentOffice(newOffice);
    setCurrentSchool(newSch);
    localStorage.setItem("sp_office", newOffice);
    localStorage.setItem("sp_school", newSch);
    setSelectedClass(null);
    setSchoolModalOpen(false);
  };

  const filteredEvents = useMemo(() => {
    return events.filter((e) => {
      if (e.grade !== selectedGrade) return false;
      const cat = e.dept || "학습";
      if (cat === "학년 공통") {
        if (!selectedClass) return true;
        if (!e.manager || e.manager === "전체") return true;
        return e.manager.includes(selectedClass);
      }
      return selectedClass ? e.dept === selectedClass : false;
    });
  }, [events, selectedGrade, selectedClass]);

  const eventsByDate = useMemo(() => {
    const map = {};
    filteredEvents.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      const isDuplicate = map[e.date].some(item => item.id === e.id);
      if (!isDuplicate) map[e.date].push(e);
    });
    return map;
  }, [filteredEvents]);

  const todayStr = ymd(today);
  const todayEvents = useMemo(() => sortEvents(eventsByDate[todayStr] || []), [eventsByDate, todayStr]);

  const monthDays = getMonthDays(viewDate);
  const monthLabel = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  const weekDates = getWeekdays(weekAnchor);
  const weekStart = weekDates[0];
  const weekEnd = weekDates[4];
  const weekLabel = `${weekStart.getMonth() + 1}/${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;

  const [selectedEventIds, setSelectedEventIds] = useState(new Set());
  const handleToggleSelectEvent = (id) => {
    setSelectedEventIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const handleToggleSelectDate = (dateStr, dateEvents) => {
    const evIds = dateEvents.map(e => e.id);
    if (evIds.length === 0) return;
    const allChecked = evIds.every(id => selectedEventIds.has(id));
    setSelectedEventIds(prev => {
      const next = new Set(prev);
      evIds.forEach(id => { if (allChecked) next.delete(id); else next.add(id); });
      return next;
    });
  };

  const defaultScheduleRow = (dateStr) => ({
    date: dateStr || ymd(today),
    targetType: "all",
    selectedTargets: [...activeClassList]
  });

  const emptyForm = { 
    targetGrade: selectedGrade,
    category: selectedClass ? "학습" : "학년 공통", 
    content: "", 
    manager: "", 
    password: "",
    schedules: [defaultScheduleRow(ymd(today))],
    repeatType: "none",
    repeatEndDate: ymd(addMonths(today, 1)),
    repeatCycles: []
  };

  const [eventModal, setEventModal] = useState(null);
  const [form, setForm] = useState(emptyForm);

  const openAddEvent = (dateStr) => {
    const baseDate = dateStr || ymd(today);
    setForm({
      ...emptyForm,
      targetGrade: selectedGrade,
      category: selectedClass ? "학습" : "학년 공통",
      schedules: [defaultScheduleRow(baseDate)],
      repeatEndDate: ymd(addMonths(today, 1)),
      repeatCycles: [{ date: baseDate }]
    });
    setEventModal({ mode: "add" });
  };

  const saveEvent = async () => {
    if (!form.content.trim()) return;
    const targetGrade = isAdminMode ? form.targetGrade : selectedGrade;
    const isGradeCommon = form.category === "학년 공통";
    const defaultTargetDept = selectedClass || (activeClassList[0] || "1반");

    const newEvents = form.schedules.map((row, idx) => ({
      id: Math.floor(Date.now() + Math.random() * 1000000 + idx) % 2147483647,
      school_name: currentSchool,
      date: row.date,
      grade: targetGrade,
      dept: isGradeCommon ? "학년 공통" : defaultTargetDept,
      content: form.content,
      manager: isGradeCommon ? (row.targetType === "all" ? "전체" : row.selectedTargets.join(", ")) : form.manager,
      password: form.password.trim() || currentClassPassword
    }));

    if (supabase) {
      await supabase.from('events').insert(newEvents);
    }
    setEvents(prev => [...prev, ...newEvents]);
    setEventModal(null);
    alert(`일정이 등록되었습니다.`);
  };

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-32 sm:p-6 sm:pb-36">
      <div className="mx-auto max-w-3xl">
        
        {/* 상단 학교/지원청 선택 바 */}
        <div className="mb-3 flex items-center justify-between rounded-xl bg-violet-900 px-4 py-2.5 text-white shadow-md">
          <div className="flex items-center gap-2 text-xs font-bold truncate">
            <SchoolIcon size={16} className="text-violet-300 shrink-0" />
            <span className="text-violet-300 font-semibold">{currentOffice}</span>
            <span className="text-sm font-black text-white truncate">{currentSchool}</span>
          </div>
          <button
            onClick={() => { setTempOffice(currentOffice); setTempSchool(currentSchool); setSchoolSearchQuery(""); setSchoolModalOpen(true); }}
            className="shrink-0 rounded-lg bg-violet-700 hover:bg-violet-600 px-3 py-1 text-xs font-bold text-white transition shadow-2xs"
          >
            학교 변경
          </button>
        </div>

        {/* 메인 헤더 패널 */}
        <div className="mb-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-3">
            <div className="min-w-0 flex-1">
              <h1 className="text-xl font-extrabold text-slate-900 sm:text-2xl whitespace-nowrap overflow-hidden text-ellipsis mb-1">
                [{selectedGrade} {selectedClass ? selectedClass : "공통"}] 학급 및 전담 행사 플래너
              </h1>
              <p className="text-xs text-slate-400">
                {selectedClass ? "학급 전용 일정 페이지입니다." : "학년 공통 뷰입니다. 특정 학급 버튼을 눌러 개별 반으로 이동하세요."}
              </p>
            </div>

            {todayPosition === "header" && (
              <div className="shrink-0 flex flex-col items-start md:items-end justify-center rounded-xl bg-gradient-to-br from-violet-50 to-indigo-50/70 border border-violet-100 p-2.5 min-w-[200px] shadow-2xs">
                <div className="flex items-center gap-1.5 text-xs font-black text-violet-700 mb-1">
                  <span>📢</span>
                  <span>오늘의 행사 ({today.getMonth() + 1}/{today.getDate()} {WEEKDAY_KOR[today.getDay()]})</span>
                </div>
                {todayEvents.length === 0 ? (
                  <span className="text-[11px] text-slate-400 font-medium">등록된 행사 없음</span>
                ) : (
                  <div className="flex flex-wrap gap-1 max-w-[260px] justify-start md:justify-end">
                    {todayEvents.slice(0, 3).map((ev, i) => (
                      <span key={i} className="rounded bg-white/90 border border-violet-200 px-1.5 py-0.5 text-[11px] font-bold text-slate-700 truncate max-w-[220px]">
                        {ev.content}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="space-y-3 border-t border-slate-100 pt-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 mr-1.5">학년:</span>
                {gradesList.map(g => (
                  <button
                    key={g}
                    onClick={() => handleGradeClick(g)}
                    className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedGrade === g ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                  >
                    {g}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-1.5 ml-auto">
                <button
                  onClick={() => setIsAdminMode(!isAdminMode)}
                  className={`flex items-center gap-1 shrink-0 rounded-lg px-2.5 py-1.5 text-xs font-bold transition shadow-2xs ${isAdminMode ? "bg-amber-500 text-white" : "border border-amber-300 bg-amber-50 text-amber-800"}`}
                >
                  <ShieldAlertIcon size={13} /> {isAdminMode ? "관리자 켜짐" : "관리자 모드"}
                </button>
                <button
                  onClick={openClassConfigModal}
                  className="flex items-center gap-1 shrink-0 rounded-lg border border-violet-200 bg-white px-2.5 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-50 shadow-2xs"
                >
                  <SettingsIcon size={13} /> 설정
                </button>
                <button
                  onClick={() => { setSelectedHolidayDate(ymd(new Date())); setHolidayModalOpen(true); }}
                  className="flex items-center gap-1 shrink-0 rounded-lg border border-rose-200 bg-white px-2.5 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 shadow-2xs"
                >
                  <span>🏖️</span> 휴일
                </button>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
              <span className="text-xs font-bold text-slate-500 mr-1.5">학급/전담:</span>
              {activeClassList.map(c => (
                <button
                  key={c}
                  onClick={() => promptSwitchClass(selectedGrade, c)}
                  className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedClass === c ? "bg-violet-600 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                >
                  {c}
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* 캘린더 본문 리스트 */}
        <div className="mb-4 flex items-center justify-between gap-2">
          <div className="flex gap-1 rounded-xl bg-slate-100 p-1">
            <button onClick={() => setTab("month")} className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tab === "month" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500"}`}>월별</button>
            <button onClick={() => setTab("week")} className={`rounded-lg px-3 py-1.5 text-xs font-bold transition ${tab === "week" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500"}`}>주간</button>
          </div>
          <button
            onClick={() => openAddEvent(tab === "month" ? ymd(today) : ymd(weekDates[0]))}
            className="flex items-center gap-1 rounded-xl bg-violet-600 px-3.5 py-2 text-xs font-bold text-white shadow-sm hover:bg-violet-700"
          >
            <PlusIcon size={14} /> 일정 추가
          </button>
        </div>

        <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 mb-8">
          {(tab === "month" ? monthDays : weekDates).map((d, idx) => {
            const dStr = ymd(d);
            const dayEvents = eventsByDate[dStr] || [];
            return (
              <DateRow
                key={dStr}
                date={d}
                today={today}
                events={dayEvents}
                isLast={idx === (tab === "month" ? monthDays : weekDates).length - 1}
                onAddEvent={openAddEvent}
                onOpenEvent={() => {}}
                customHolidays={customHolidays}
                selectedEventIds={selectedEventIds}
                onToggleSelectEvent={handleToggleSelectEvent}
                onToggleSelectDate={handleToggleSelectDate}
                isDateSelected={false}
              />
            );
          })}
        </div>

        {/* 학교 변경 모달 (지원청 ➔ 학교 가나다순 선택) */}
        {schoolModalOpen && (
          <Modal title="인천광역시 초등학교 선택" onClose={() => setSchoolModalOpen(false)} wide>
            <div className="space-y-4">
              <div>
                <FieldLabel>1. 관할 교육지원청 선택</FieldLabel>
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
                  {Object.keys(INCHEON_SCHOOLS).map(off => (
                    <button
                      key={off}
                      type="button"
                      onClick={() => { setTempOffice(off); setTempSchool(INCHEON_SCHOOLS[off][0]); }}
                      className={`rounded-xl py-2 px-1 text-xs font-bold transition border ${tempOffice === off ? "bg-violet-600 text-white border-violet-600 shadow-xs" : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"}`}
                    >
                      {off.replace("교육지원청", "")}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1">
                  <FieldLabel>2. 소속 초등학교 선택 (가나다순)</FieldLabel>
                  <span className="text-[11px] text-slate-400 font-medium">총 {INCHEON_SCHOOLS[tempOffice]?.length || 0}개교</span>
                </div>

                <input
                  type="text"
                  value={schoolSearchQuery}
                  onChange={(e) => setSchoolSearchQuery(e.target.value)}
                  placeholder="학교 이름 검색 (예: 경연, 가좌)"
                  className="mb-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-700 outline-none focus:bg-white focus:border-violet-400"
                />

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-56 overflow-y-auto p-1 border border-slate-100 rounded-xl bg-slate-50/50">
                  {(INCHEON_SCHOOLS[tempOffice] || [])
                    .filter(s => s.includes(schoolSearchQuery))
                    .map(sch => (
                      <button
                        key={sch}
                        type="button"
                        onClick={() => setTempSchool(sch)}
                        className={`rounded-lg p-2 text-xs font-bold text-left truncate transition border ${tempSchool === sch ? "bg-violet-600 text-white border-violet-600 shadow-xs" : "bg-white text-slate-700 border-slate-200 hover:bg-violet-50"}`}
                      >
                        {sch}
                      </button>
                    ))}
                </div>
              </div>

              <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={() => setSchoolModalOpen(false)}
                  className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50"
                >
                  취소
                </button>
                <button
                  type="button"
                  onClick={() => handleApplySchoolChange(tempOffice, tempSchool)}
                  className="flex-1 rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white hover:bg-violet-700 shadow-md shadow-violet-200"
                >
                  [{tempSchool}] 접속하기
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 일정 추가 모달 */}
        {eventModal && (
          <Modal title="일정 등록" onClose={() => setEventModal(null)}>
            <div className="space-y-3">
              <div>
                <FieldLabel>행사 내용</FieldLabel>
                <input
                  type="text"
                  value={form.content}
                  onChange={(e) => setForm({ ...form, content: e.target.value })}
                  placeholder="예) 현장체험학습"
                  className={inputCls}
                />
              </div>
              <button
                onClick={saveEvent}
                className="w-full rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white hover:bg-violet-700 shadow-md"
              >
                저장하기
              </button>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
